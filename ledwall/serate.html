<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Sottosopra — Ledwall · Le quattro serate</title>
<link rel="stylesheet" href="_shared.css">
<style>
  /* «LE QUATTRO SERATE» — la mappa del festival: dove siamo e cosa resta.
     Le serate passate si spengono, quella in corso è invertita, quelle che
     restano sono accese. Si legge in un secondo da trenta metri, e dice al
     pubblico l'unica cosa che lo fa tornare: che c'è ancora qualcosa dopo.
     Giornata da ?day=gio|ven|sab|dom, altrimenti dalla data reale. */

  .scene { position: absolute; inset: 40px 34px 74px; display: flex; flex-direction: column; }

  .kick { overflow: hidden; margin-bottom: 22px; }

  .rows { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; }

  /* la maschera porta i margini negativi, non la riga: altrimenti il box
     invertito (largo 14px in più per lato) veniva tagliato dall'overflow
     e la parola a destra spariva a metà. */
  .rmask { overflow: hidden; margin: 0 -14px; }
  .row {
    display: flex; align-items: baseline; gap: 26px;
    padding: 9px 14px;
  }
  .row .n    { font-size: 62px; line-height: 1; width: 108px; flex-shrink: 0; }
  .row .d    { font-size: 20px; letter-spacing: 0.16em; text-transform: uppercase;
               width: 172px; flex-shrink: 0; color: var(--muted); white-space: nowrap; }
  .row .who  { font-size: 40px; line-height: 1; text-transform: uppercase; white-space: nowrap; }
  .row .tag  { margin-left: auto; font-size: 15px; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--muted); flex-shrink: 0; }

  /* passata: si spegne (resta leggibile, non sparisce: è la storia del festival) */
  .row.past .n, .row.past .who { color: #4a4a4a; }
  .row.past .d, .row.past .tag { color: #3a3a3a; }

  /* in corso: invertita, è l'unico blocco bianco della scena */
  .row.now { background: var(--fg); color: var(--bg); }
  .row.now .d, .row.now .tag { color: rgba(0,0,0,0.55); }

  .foot {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-top: 18px; overflow: hidden;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div class="scene">
      <div class="kick"><span class="label" id="kick">Quattro serate</span></div>
      <div class="rows" id="rows"></div>
      <div class="foot">
        <span class="label" id="footL">Biglietti su sottosopra.com</span>
        <span class="label" id="footR">Giardini del Castello</span>
      </div>
    </div>
  </div>
</div>

<script src="vendor/gsap.min.js"></script>
<script src="vendor/CustomEase.min.js"></script>
<script src="_shared.js"></script>
<script>
/* le quattro serate, col nome che le identifica per il pubblico */
var SERATE = [
  { k: 'gio', n: '30', d: 'Gio 30 lug', who: 'Adrian Fartade',    tag: 'Ingresso libero' },
  { k: 'ven', n: '31', d: 'Ven 31 lug', who: 'Generic Animal',    tag: 'Live' },
  { k: 'sab', n: '01', d: 'Sab 01 ago', who: 'Vendredi sur Mer',  tag: 'Live' },
  { k: 'dom', n: '02', d: 'Dom 02 ago', who: 'Ex-Otago',          tag: 'Live' },
];

function pickDay() {
  var q = new URLSearchParams(location.search).get('day');
  if (q && SERATE.some(function (s) { return s.k === q; })) return q;
  var d = new Date();
  var iso = String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  return { '07-30': 'gio', '07-31': 'ven', '08-01': 'sab', '08-02': 'dom' }[iso] || 'ven';
}

LW.ready(function () {
  var today = pickDay();
  var idx = SERATE.findIndex(function (s) { return s.k === today; });
  var esc = function (s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); };

  var rowsEl = document.getElementById('rows');
  rowsEl.innerHTML = SERATE.map(function (s, i) {
    var cls = i < idx ? ' past' : (i === idx ? ' now' : '');
    return '<div class="rmask"><div class="row' + cls + '">' +
      '<span class="n">' + s.n + '</span>' +
      '<span class="d">' + esc(s.d) + '</span>' +
      '<span class="who">' + esc(s.who) + '</span>' +
      '<span class="tag">' + esc(s.tag) + '</span>' +
    '</div></div>';
  }).join('');

  /* i nomi lunghi non devono mai spingere fuori la colonna di destra */
  [].slice.call(rowsEl.querySelectorAll('.row')).forEach(function (row) {
    var who = row.querySelector('.who'), fs = 40, guard = 0;
    while (row.scrollWidth > row.clientWidth && fs > 22 && guard++ < 20) {
      fs -= 2; who.style.fontSize = fs + 'px';
    }
  });

  /* il cappello dice quante ne restano: è l'informazione che fa tornare */
  var restano = SERATE.length - idx - 1;
  var kick = document.getElementById('kick');
  kick.textContent = restano === 0 ? 'Ultima serata'
    : restano === 1 ? 'Dopo stasera ne resta una'
    : 'Dopo stasera ne restano ' + restano;
  if (restano === 0) document.getElementById('footL').textContent = 'Grazie di essere stati qui';

  var rows = [].slice.call(rowsEl.querySelectorAll('.row'));
  var foot = [].slice.call(document.querySelectorAll('.foot .label'));

  var tl = gsap.timeline({ repeat: -1 });

  tl.set(kick, { yPercent: 110 });
  tl.set(rows, { yPercent: 110 });
  tl.set(foot, { yPercent: 110 });

  tl.to(kick, { yPercent: 0, duration: 0.75, ease: 'soso' });
  tl.to(rows, { yPercent: 0, duration: 0.85, ease: 'soso', stagger: 0.1 }, '-=0.4');
  tl.to(foot, { yPercent: 0, duration: 0.7, ease: 'soso', stagger: 0.06 }, '-=0.35');

  /* tenuta: la riga di stasera pulsa piano — è il «tu sei qui» della mappa */
  var now = rows[idx];
  if (now) tl.to(now, { scale: 1.012, duration: 2.8, ease: 'sine.inOut',
                        yoyo: true, repeat: 3, transformOrigin: '0% 50%' });
  else tl.to({}, { duration: 11.2 });

  tl.to(rows, { yPercent: -110, duration: 0.5, ease: 'power2.in', stagger: 0.05 });
  tl.to([kick, foot], { yPercent: -110, duration: 0.5, ease: 'power2.in' }, '<');
  tl.to({}, { duration: 0.6 });

  window.TL = tl;

  /* dopo mezzanotte la serata cambia: la pagina si riallinea da sola */
  setTimeout(function () { location.reload(); }, 300000);
});
</script>
</body>
</html>
