<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Sottosopra — Ledwall · Foto + logo</title>
<style>
  @font-face {
    font-family: 'SoSo26';
    src: url('fonts/SoSo26.woff2') format('woff2'), url('fonts/SoSo26.woff') format('woff');
    font-display: block;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #000; height: 100%; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: grid; place-items: center; background: #000; }

  #stage {
    width: 1034px; height: 689px; background: #000; overflow: hidden;
    position: relative; flex-shrink: 0;
    font-family: 'SoSo26', sans-serif;
    font-feature-settings: "ss07", "ss08", "liga", "calt";
  }

  /* foto B/N: ken burns lentissimo, scurita per il led */
  .photo {
    position: absolute; inset: 0;
    background: url('media/crowd-night-wide.jpg') center 30% / cover no-repeat;
    filter: grayscale(1) brightness(0.62) contrast(1.08);
    animation: kb 48s ease-in-out infinite alternate;
  }
  @keyframes kb { from { transform: scale(1.02); } to { transform: scale(1.09); } }

  /* vignetta: i bordi del ledwall restano scuri */
  .vig {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 75% 68% at 50% 46%, transparent 45%, rgba(0,0,0,0.72) 100%);
  }

  .logo {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 720px;
  }
  .logo img { width: 100%; display: block; }

  .meta {
    position: absolute; left: 34px; right: 34px; bottom: 26px;
    display: flex; justify-content: space-between;
    color: #fff; font-size: 17px; letter-spacing: 0.14em; text-transform: uppercase;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div class="photo"></div>
    <div class="vig"></div>
    <div class="logo"><img src="media/sottosopra-logo-white.png" alt="Sottosopra"></div>
    <div class="meta"><span>Giardini del Castello</span><span>Castelfranco Veneto</span></div>
  </div>
</div>
<script>
  function fit() {
    const s = Math.min(window.innerWidth / 1034, window.innerHeight / 689);
    document.getElementById('stage').style.transform = s < 1 ? `scale(${s})` : '';
    document.getElementById('stage').style.transformOrigin = 'center';
  }
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
