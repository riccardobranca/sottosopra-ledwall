<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Sottosopra — Ledwall · Inquadra il QR</title>
<link rel="stylesheet" href="_shared.css">
<style>
  /* DUE COLONNE che non si toccano mai. Con l'hook full-width e il QR in
     sovrimpressione (prima versione) il box copriva la parola «FESTIVAL?»:
     qui il testo si giustifica DENTRO la sua colonna e il QR ha la sua. */
  .scene {
    position: absolute; inset: 56px 34px 86px;
    display: flex; align-items: center; gap: 46px;
  }

  /* hook giustificato — riempie la colonna sinistra (2 blocchi .just = 2 frasi,
     come i poster: ogni frase è un paragrafo a sé) */
  #hook { flex: 1; min-width: 0; }
  #hook .just { font-size: 74px; }

  /* unità QR — colonna destra. Il box resta BIANCO pieno (quiet zone):
     ⚠ QR INVERTITO (bianco su nero), su richiesta: coerente col muro, ma lo
     standard prevede moduli scuri su fondo chiaro. Gli scanner di iPhone e
     Android recenti leggono anche l'invertito, non tutti i lettori però:
     VA PROVATO COL TELEFONO prima del festival. Se non legge, basta togliere
     il filter:invert(1) qui sotto e rimettere il fondo bianco. */
  #qrunit {
    width: 300px; flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center;
  }
  #qrbox {
    width: 300px; height: 300px; background: #000;   /* invertito: fondo nero */
    position: relative; overflow: hidden;
  }
  /* qr-ingresso.svg è 370×370 SENZA viewBox: niente resize via width CSS
     (in <img> il contenuto potrebbe non scalare e uscire ritagliato).
     Lo si lascia alla dimensione intrinseca e lo si riduce via transform:
     240/330 = 0.7273 → QR 240×240 centrato, mai deformato. */
  #qrbox img {
    filter: invert(1);                                /* moduli bianchi */
    display: block; position: absolute; left: 50%; top: 50%;
    width: 330px; height: 330px;
    transform: translate(-50%, -50%) scale(0.7273);
  }
  #qrunit .label { margin-top: 22px; font-size: 21px; letter-spacing: 0.14em;
                   white-space: nowrap; color: var(--fg); }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div class="scene">
      <div id="hook">
        <div class="just" data-text="Vuoi sapere tutto"></div>
        <div class="just" data-text="del festival?"></div>
      </div>
      <div id="qrunit">
        <div id="qrbox"><img src="media/qr-sottosopra.svg" alt="QR verso sottosopra.com"></div>
        <div class="label">www.sottosopra.com</div>
      </div>
    </div>
  </div>
</div>

<script src="vendor/gsap.min.js"></script>
<script src="vendor/CustomEase.min.js"></script>
<script src="_shared.js"></script>
<script>
LW.ready(function () {
  /* righe giustificate + delta "compatto → giustificato" */
  var lines = [];
  [].slice.call(document.querySelectorAll('#hook .just')).forEach(function (j) {
    LW.justify(j).forEach(function (line) {
      var deltas = LW.packDeltas(line);
      [].slice.call(line.children).forEach(function (wd, i) { wd._dx = deltas[i]; });
      lines.push(line);
    });
  });
  var words = [].slice.call(document.querySelectorAll('#hook .wd'));

  /* stato iniziale applicato SUBITO (niente flash prima del primo tick) */
  gsap.set(lines, { yPercent: 110 });
  gsap.set(words, { x: function (i, t) { return t._dx || 0; } });

  /* ── ciclo master: 18.0s esatti ──
     · QR: 3 respiri da 6s (1↔1.012) → chiude a scale 1
     · titolo: reveal → tenuta → uscita → re-reveal al giro dopo (~ogni 15s) */
  var tl = gsap.timeline({ repeat: -1 });

  /* primo frame ≡ ultimo frame: righe sotto la maschera, parole compatte */
  tl.set(lines, { yPercent: 110 }, 0);
  tl.set(words, { x: function (i, t) { return t._dx || 0; } }, 0);

  /* il QR respira per tutto il ciclo: impercettibile, resta scansionabile */
  tl.to('#qrbox', { scale: 1.012, duration: 3, ease: 'sine.inOut', yoyo: true, repeat: 5 }, 0);

  /* 1 · reveal mascherato delle righe */
  tl.to(lines, { yPercent: 0, duration: 0.9, ease: 'soso', stagger: 0.12 }, 0.6);
  /* 2 · l'aria si apre: le parole si distribuiscono edge-to-edge */
  tl.to(words, { x: 0, duration: 1.2, ease: 'expo.inOut', stagger: 0.012 }, 1.05);
  /* 3 · tenuta: il titolo respira appena e torna a 1 prima dell'uscita */
  tl.to('#hook', { scale: 1.008, duration: 6.9, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 2.4);
  /* 4 · uscita verso l'alto */
  tl.to(lines, { yPercent: -110, duration: 0.6, ease: 'power2.in', stagger: 0.08 }, 16.2);
  /* 5 · reset invisibile → ultimo frame ≡ primo frame ESATTO */
  tl.set(lines, { yPercent: 110 }, 17.4);
  tl.set(words, { x: function (i, t) { return t._dx || 0; } }, 17.4);
  tl.to({}, { duration: 0.6 }, 17.4); /* respiro nero: chiude il ciclo a 18.0s */

  window.TL = tl; /* per scrub/verifica deterministica */
});
</script>
</body>
</html>
