<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Sottosopra — Ledwall · Nastri partner</title>
<style>
  @font-face {
    font-family: 'SoSo26';
    src: url('fonts/SoSo26.woff2') format('woff2'), url('fonts/SoSo26.woff') format('woff');
    font-display: block;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #000; height: 100%; overflow: hidden; }

  /* wrapper: centra e scala lo stage per l'anteprima; a 1034x689 esatti scala=1 */
  #wrap { position: fixed; inset: 0; display: grid; place-items: center; background: #000; }

  #stage {
    width: 1034px; height: 689px;
    background: #000; color: #fff;
    font-family: 'SoSo26', sans-serif;
    font-feature-settings: "ss07", "ss08", "liga", "calt";
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 30px 34px 26px;
    overflow: hidden;
    flex-shrink: 0;
  }

  /* ── titolo giustificato edge-to-edge (riga multi-parola: aria nei gap) ── */
  .title {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 74px; line-height: 1; text-transform: uppercase;
    white-space: nowrap;
  }

  /* ── bande ── */
  .band { display: flex; flex-direction: column; gap: 9px; }
  .band-label {
    font-size: 15px; letter-spacing: 0.18em; text-transform: uppercase;
    color: #8a8a8a;
  }
  .win { overflow: hidden; display: flex; align-items: center; }
  .track { display: flex; width: max-content; will-change: transform; animation: scroll var(--dur, 40s) linear infinite; }
  .seq { display: flex; align-items: center; gap: var(--gap, 70px); padding-right: var(--gap, 70px); }
  .seq img { filter: invert(1); display: block; }
  .seq .txt {
    color: #fff; text-transform: uppercase; letter-spacing: 0.05em;
    white-space: nowrap; line-height: 1;
  }
  @keyframes scroll { to { transform: translateX(-50%); } }

  .rule { height: 2px; background: #2e2e2e; }

  /* ── meta footer ── */
  .meta {
    display: flex; justify-content: space-between;
    font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase;
    color: #8a8a8a;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div class="title" id="title"></div>

    <div class="band" data-tier="main" data-base="126" data-speed="34" data-gap="86">
      <div class="band-label">Main partner</div>
      <div class="win" style="height:158px"><div class="track"></div></div>
    </div>
    <div class="rule"></div>
    <div class="band" data-tier="premium" data-base="92" data-speed="52" data-gap="72">
      <div class="band-label">Partner</div>
      <div class="win" style="height:116px"><div class="track"></div></div>
    </div>
    <div class="rule"></div>
    <div class="band" data-tier="supporter" data-base="62" data-speed="76" data-gap="58">
      <div class="band-label">Supporter e partner tecnici</div>
      <div class="win" style="height:80px"><div class="track"></div></div>
    </div>

    <div class="meta"><span>Sottosopra</span><span>Cambia il punto di vista</span></div>
  </div>
</div>

<script>
  // ── titolo: parole a tracciatura naturale, aria distribuita nei gap ──
  const TITLE = ['LO', 'RENDONO', 'POSSIBILE'];
  document.getElementById('title').innerHTML = TITLE.map(w => `<span>${w}</span>`).join('');

  // ── partner 2026 (da sponsors.yaml del sito) ──
  const P = {
    main: ['prodeco', 'banca-terre-venete', 'cna', 'super-agency', 'azimut', 'ceccato'],
    premium: ['adriatica-strade', 'merieux', 'ferro', 'got-bag'],
    supporter: [
      'vudafieri', 'zurich-spadavecchia', 'fraccaro', 'permatech', 'jb-baggio',
      'ots-sistemi', 'noi-group', 'banda-bistrot', 'brewrise', 'dentro-centro',
      'santi-autotrasporti', 'hotel-alla-torre', 'albergo-roma', 'proloco-castelfranco',
      'santi-group', 'officine-tonello', 'TEXT:Studio Fiscon', 'piu-service',
      'via-vai', 'citta-invisibile', 'despar'
    ],
  };

  // normalizzazione ad AREA percettiva (stessa formula del PartnerLedger del sito):
  // h = base * sqrt(2.8 / AR), clamp [0.5, 1.3] * base
  function buildBand(band) {
    const tier = band.dataset.tier;
    const base = +band.dataset.base;
    const speed = +band.dataset.speed;   // px/s
    const gap = +band.dataset.gap;
    const track = band.querySelector('.track');
    track.style.setProperty('--gap', gap + 'px');

    const makeSeq = () => {
      const seq = document.createElement('div');
      seq.className = 'seq';
      for (const id of P[tier]) {
        if (id.startsWith('TEXT:')) {
          const s = document.createElement('span');
          s.className = 'txt';
          s.textContent = id.slice(5);
          s.style.fontSize = Math.round(base * 0.52) + 'px';
          seq.appendChild(s);
        } else {
          const img = document.createElement('img');
          img.src = 'logos/' + id + '.png';
          img.alt = id;
          seq.appendChild(img);
        }
      }
      return seq;
    };
    track.appendChild(makeSeq());
    track.appendChild(makeSeq());

    // dopo il load: altezza per-logo + durata dalla larghezza reale
    const imgs = [...track.querySelectorAll('img')];
    Promise.all(imgs.map(i => i.decode().catch(() => {}))).then(() => {
      for (const img of imgs) {
        const ar = img.naturalWidth / img.naturalHeight;
        const k = Math.min(1.3, Math.max(0.5, Math.sqrt(2.8 / ar)));
        img.style.height = Math.round(base * k) + 'px';
      }
      requestAnimationFrame(() => {
        const seqW = track.querySelector('.seq').getBoundingClientRect().width;
        track.style.setProperty('--dur', (seqW / speed).toFixed(2) + 's');
      });
    });
  }
  document.querySelectorAll('.band').forEach(buildBand);

  // ── scala l'anteprima alla finestra (a 1034x689 esatti = 1:1) ──
  function fit() {
    const s = Math.min(window.innerWidth / 1034, window.innerHeight / 689);
    document.getElementById('stage').style.transform = s < 1 ? `scale(${s})` : '';
  }
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
