<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Sottosopra — Ledwall · Domani sera</title>
<link rel="stylesheet" href="_shared.css">
<style>
  /* «DOMANI SERA» — l'invito a tornare. Tutti i nomi della serata successiva
     alla STESSA dimensione: nessun headliner, nessuna gerarchia — domani si
     viene per la serata, non per un nome solo.
     La domenica cambia registro: è l'ultima, non c'è un domani. */

  #inner { position: absolute; inset: 30px 34px 34px; display: flex; flex-direction: column; }

  #kick { overflow: hidden; }

  #names {
    flex: 1 1 0; min-height: 0;
    margin-top: 18px;
    display: flex; flex-direction: column;
  }
  .nm { flex: 0 0 auto; }
  /* la maschera lascia passare i discendenti (l'ogonek di DEGHEĮO) senza
     alterare l'altezza di riga */
  #names .lnmask { padding-bottom: 0.08em; margin-bottom: -0.08em; }

  /* riga bassa: data in un box invertito + biglietti */
  #foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 30px; margin-top: 16px; }
  #datemask { overflow: hidden; }
  #date {
    background: var(--fg); color: var(--bg);
    padding: 8px 26px 14px;
    font-size: 54px; line-height: 1; letter-spacing: 0.02em;
    text-transform: uppercase; white-space: nowrap;
  }
  #ctamask { overflow: hidden; }

  /* metro invisibile per il fit dei nomi */
  #meas {
    position: absolute; left: -4000px; top: 0; visibility: hidden;
    display: inline-block; white-space: nowrap; text-transform: uppercase;
    font-size: 100px; line-height: 1; letter-spacing: normal;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div id="inner">
      <div id="kick"><span class="label" id="kicktx">Domani sera</span></div>
      <div id="names"></div>
      <div id="foot">
        <div id="datemask"><div id="date"></div></div>
        <div id="ctamask"><span class="label" id="cta">Biglietti su sottosopra.com</span></div>
      </div>
    </div>
    <span id="meas" aria-hidden="true"></span>
  </div>
</div>

<script src="vendor/gsap.min.js"></script>
<script src="vendor/CustomEase.min.js"></script>
<script src="_shared.js"></script>
<script>
/* Cosa succede DOMANI (fonte: programma.yaml 2026). Tutti i nomi in ordine di
   scaletta, senza distinzione: sul muro pesano uguale. */
var TOMORROW = {
  gio: { kick: 'Domani sera', date: 'Ven 31 Lug',
         names: ['SPAGHETTI DISCO', 'DEGHEĮO', 'GENERIC ANIMAL', 'KRANO', 'CAVALLI MONGOLI'] },
  ven: { kick: 'Domani sera', date: 'Sab 01 Ago',
         names: ['FROM DISCO TO DISCO', 'POPA', 'VENDREDI SUR MER', 'FACCIANUVOLA'] },
  sab: { kick: 'Domani sera', date: 'Dom 02 Ago',
         names: ['DR. PIRA', 'LIBRI BRUTTI', 'ELASI', 'JESSE THE FACCIO', 'AURORO BOREALO', 'EX-OTAGO'] },
  /* domenica: è l'ultima serata, non c'è un domani */
  dom: { last: true, kick: 'Ultima serata',
         names: ['CI VEDIAMO', "L'ANNO PROSSIMO"], cta: 'Sottosopra torna nel 2027' }
};

function pickDay() {
  var q = new URLSearchParams(location.search).get('day');
  if (q && TOMORROW[q]) return q;
  var d = new Date();
  var iso = String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  return { '07-30': 'gio', '07-31': 'ven', '08-01': 'sab', '08-02': 'dom' }[iso] || 'ven';
}

var CICLO = 20, HIDE = 125, GAPV = 14, FS_MAX = 150, FS_MIN = 30;

LW.ready(function () {
  var D = TOMORROW[pickDay()];
  var kickEl = document.getElementById('kicktx');
  var namesEl = document.getElementById('names');
  var dateEl = document.getElementById('date');
  var dateMask = document.getElementById('datemask');
  var ctaEl = document.getElementById('cta');
  var meas = document.getElementById('meas');

  kickEl.textContent = D.kick;
  if (D.cta) ctaEl.textContent = D.cta;

  /* l'ultima serata non ha una data di domani: via il box */
  if (D.last) { dateMask.parentNode.removeChild(dateMask); dateMask = null; }
  else dateEl.textContent = D.date;

  /* ── i nomi, tutti pari: un corpo per riga che riempie la larghezza ──
     Misure con offsetWidth/clientWidth: getBoundingClientRect torna 0 quando
     la pagina non è dipinta (finestra nascosta) e il fit sballerebbe. */
  var list = D.names, n = list.length;
  namesEl.innerHTML = list.map(function () { return '<div class="just nm"></div>'; }).join('');
  var els = [].slice.call(namesEl.children);
  var availW = namesEl.clientWidth;
  var availH = namesEl.clientHeight;
  var cap = Math.floor((availH - GAPV * (n - 1)) / n);

  function overflows(el) {
    var lines = el.querySelectorAll('.ln');
    if (lines.length !== 1) return true;
    var kids = lines[0].children, s = 0;
    for (var k = 0; k < kids.length; k++) s += kids[k].offsetWidth;
    return s > lines[0].clientWidth - 3;
  }

  var nameLines = [];
  els.forEach(function (el, i) {
    meas.textContent = list[i];
    var w100 = meas.offsetWidth || 1;
    var fs = Math.max(FS_MIN, Math.min(Math.floor(availW * 0.99 * 100 / w100), cap, FS_MAX));
    el.setAttribute('data-text', list[i]);
    el.setAttribute('aria-label', list[i]);
    el.style.fontSize = fs + 'px';
    LW.justify(el);
    var guard = 0;
    while (overflows(el) && fs > FS_MIN && guard++ < 60) {
      fs -= 2; el.style.fontSize = fs + 'px'; LW.justify(el);
    }
    nameLines = nameLines.concat([].slice.call(el.querySelectorAll('.ln')));
  });
  meas.textContent = '';

  /* tetto all'aria: sotto il 62% di riempimento il nome resta compatto,
     altrimenti le lettere si sfarinano e non si legge più (vedi stasera.html) */
  nameLines.forEach(function (ln) {
    var kids = [].slice.call(ln.children);
    if (kids.length < 2) return;
    var ink = kids.reduce(function (s, k) { return s + k.offsetWidth; }, 0);
    if (ink / ln.clientWidth < 0.62) {
      ln.style.justifyContent = 'flex-start';
      var isLetters = kids.every(function (k) { return k.textContent.length === 1; });
      ln.style.gap = (isLetters ? 0.04 : 0.3) + 'em';
    }
  });
  namesEl.style.justifyContent = n > 1 ? 'space-between' : 'center';

  var tl = gsap.timeline({ repeat: -1 });
  var foot = dateMask ? [dateEl, ctaEl] : [ctaEl];

  tl.set(kickEl, { yPercent: HIDE });
  tl.set(nameLines, { yPercent: HIDE });
  tl.set(foot, { yPercent: HIDE });

  tl.to(kickEl, { yPercent: 0, duration: 0.7, ease: 'soso' });
  tl.to(nameLines, { yPercent: 0, duration: 0.9, ease: 'soso', stagger: 0.1 }, '-=0.35');
  tl.to(foot, { yPercent: 0, duration: 0.8, ease: 'soso', stagger: 0.08 }, '-=0.4');

  /* tenuta calcolata perché il ciclo chiuda esatto a CICLO secondi */
  var speso = tl.duration();
  tl.to('#inner', { scale: 1.006, duration: Math.max(0.6, (CICLO - speso - 1.7) / 2),
                    ease: 'sine.inOut', yoyo: true, repeat: 1 });

  tl.to(nameLines, { yPercent: -HIDE, duration: 0.55, ease: 'power2.in', stagger: 0.05 });
  tl.to([kickEl].concat(foot), { yPercent: -HIDE, duration: 0.5, ease: 'power2.in' }, '<');
  tl.to({}, { duration: 0.6 });

  window.TL = tl;
  setTimeout(function () { if (tl.time() < 0.5) tl.progress(0.4); }, 3000);
});
</script>
</body>
</html>
