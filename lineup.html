<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Sottosopra — Ledwall · La lineup</title>
<link rel="stylesheet" href="_shared.css">
<style>
  /* ── LA LINEUP — tutti i nomi dell'edizione in una colonna che sale ──
     UNA sola idea: un rullo verticale lineare lentissimo (~26 px/s), titoli di
     coda con la tipografia del manifesto. Nessun effetto secondario: il moto
     continuo È il respiro della scena.

     Loop senza cucitura: il track contiene DUE copie identiche della lista;
     translateY(-50%) = esattamente una lista → ultimo frame ≡ primo frame.
     Moto tutto in CSS keyframes (compositor-friendly, gira anche nel preview
     throttlato) → niente window.TL, come da SPEC punto 11 per il moto continuo. */

  #roll { position: absolute; inset: 0; overflow: hidden; }

  #track { will-change: transform; backface-visibility: hidden; }
  #track.go { animation: lw-roll var(--dur, 66s) linear infinite; }
  @keyframes lw-roll {
    from { transform: translate3d(0, 0, 0); }
    to   { transform: translate3d(0, -50%, 0); }
  }

  /* la colonna dei nomi vive dentro i margini di stage (34px) */
  .list { padding: 0 34px; }

  .row {
    display: flex; align-items: baseline;
    padding: 22px 0;
    border-top: 2px solid var(--line); /* SEMPRE, anche la prima: nel rullo ogni
                                          nome ha il suo regolo sopra, giunzione
                                          fra le due copie compresa */
  }
  .nm {
    flex: none; white-space: nowrap;
    font-size: 62px; line-height: 1; text-transform: uppercase;
  }
  .kd { flex: none; margin-left: auto; white-space: nowrap; } /* + .label */

  /* ── cornice: due fasce NERE PIENE sopra il rullo ──
     tagliano di netto ingresso e uscita dei nomi (niente gradienti) e portano
     la firma della scena: qui sopra il cosa/quando, qui sotto il dove.
     Il regolo interno è statico (non scorre) → nessun rischio di shimmer. */
  .band {
    /* 92px, non 54: le fasce devono MANGIARE il nome che entra e quello che esce.
       Più sottili, lasciavano una riga tagliata a metà lettera sopra il bordo. */
    position: absolute; left: 0; right: 0; height: 92px; z-index: 3;
    background: var(--bg);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 34px;
  }
  .band::after {
    content: ''; position: absolute; left: 0; right: 0;
    height: 3px; background: var(--muted);
  }
  #bandTop { top: 0; }
  #bandTop::after { bottom: 0; }
  #bandBot { bottom: 0; }
  #bandBot::after { top: 0; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">

    <div id="roll">
      <div id="track"><div class="list" id="list"></div></div>
    </div>

    <!-- niente .meta: le fasce fanno da cornice e da firma (deroga di scena) -->
    <div class="band" id="bandTop">
      <span class="label">Lineup 2026</span>
      <span class="label">30 Lug — 02 Ago</span>
    </div>
    <div class="band" id="bandBot">
      <span class="label">Giardini del Castello</span>
      <span class="label">Castelfranco Veneto</span>
    </div>

  </div>
</div>

<script src="_shared.js"></script>
<script>
/* Ordine di scaletta dell'edizione 2026 (giovedì → domenica). */
var LINEUP = [
  ['ADRIAN FARTADE',      'Talk'],
  ['DEGHEĮO',             'Live'],
  ['GENERIC ANIMAL',      'Live'],
  ['KRANO',               'Live'],
  ['CAVALLI MONGOLI',     'Live'],
  ['FROM DISCO TO DISCO', 'DJ Set'],
  ['POPA',                'Live'],
  ['VENDREDI SUR MER',    'Live'],
  ['FACCIANUVOLA',        'Live'],
  ['DR. PIRA',            'Show'],
  ['LIBRI BRUTTI',        'Show'],
  ['JESSE THE FACCIO',    'Live'],
  ['AURORO BOREALO',      'Live'],
  ['EX-OTAGO',            'Live'],
  ['ELASI',               'DJ Set'],
  ['RAZVAN',              'DJ Set']
];

var SPEED = 26;   /* px/s — lentissimo: l'alto contrasto B/N in moto veloce fa judder */
var FS0   = 62;   /* corpo nominale dei nomi */
var GAP   = 44;   /* aria minima garantita fra nome e etichetta */

LW.ready(function () {
  var esc = function (s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); };
  var list  = document.getElementById('list');
  var track = document.getElementById('track');

  list.innerHTML = LINEUP.map(function (r) {
    return '<div class="row">' +
             '<span class="nm">' + esc(r[0]) + '</span>' +
             '<span class="label kd">' + esc(r[1]) + '</span>' +
           '</div>';
  }).join('');

  /* ── fit: UN corpo solo per tutti i nomi (una lineup non è un collage di
     misure). Si parte da 62px e si scende solo se il nome più lungo non entra
     nella colonna insieme alla sua etichetta. Tutto in px CSS non scalati
     (offsetWidth ignora il transform di anteprima). ── */
  var rows = [].slice.call(list.querySelectorAll('.row'));
  var fs = FS0;
  rows.forEach(function (row) {
    var nm = row.querySelector('.nm'), kd = row.querySelector('.kd');
    if (!nm.offsetWidth) return;
    var max = (row.clientWidth - GAP - kd.offsetWidth) * FS0 / nm.offsetWidth;
    if (max < fs) fs = max;
  });
  fs = Math.max(40, Math.min(FS0, Math.floor(fs)));

  function applyFs() {
    rows.forEach(function (row) { row.querySelector('.nm').style.fontSize = fs + 'px'; });
  }
  if (fs !== FS0) applyFs();

  /* rete di sicurezza (tolleranza 4px: niente ellissi né sovrapposizioni sul ledwall) */
  var guard = 0;
  while (guard++ < 24 && fs > 34 && rows.some(function (r) { return r.scrollWidth > r.clientWidth + 4; })) {
    fs -= 1; applyFs();
  }

  /* ── seconda copia IDENTICA (clonata dopo il fit: le due metà devono essere
     alte uguali, o il -50% non chiude il loop) ── */
  var copy = list.cloneNode(true);
  copy.removeAttribute('id');
  copy.setAttribute('aria-hidden', 'true');
  track.appendChild(copy);

  /* durata = altezza di UNA lista / velocità → px/s esatti.
     L'animazione parte solo ora: nessuno scatto di fase all'avvio. */
  track.style.setProperty('--dur', (list.offsetHeight / SPEED).toFixed(2) + 's');
  track.classList.add('go');
});
</script>
</body>
</html>
