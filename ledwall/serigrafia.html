<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Sottosopra — Ledwall · Serigrafia</title>
<link rel="stylesheet" href="_shared.css">
<style>
  /* «SERIGRAFIA» — la folla come stampa serigrafica: due soli inchiostri, nero e
     bianco, nessun mezzo tono se non il minimo che tiene in piedi i volumi.
     Sopra, in basso a sinistra, un blocco nero pieno con la frase: il nero non è
     decorazione, è il PAVIMENTO che tiene il testo leggibile anche quando sotto
     passa una zona bruciata della stampa.
     Una sola idea: la stampa respira (ken burns lentissimo), il blocco entra e
     se ne va una volta per ciclo. */

  /* ── la stampa ───────────────────────────────────────────────────────────────
     Ordine dei filtri: brightness PRIMA di contrast. Misurata, la foto è
     notturna e scurissima (mediana 0.085, 99° percentile 0.457): con
     `contrast()` in testa la soglia cade a 0.42 e il fotogramma diventa nero
     pieno. Si alza prima il livello (×2.7 porta ~0.185 sul punto di soglia) e
     poi si taglia (×6). Resa misurata sul fotogramma reale:
       ~73% nero puro · ~16% bianco puro · ~11% di rampa che tiene i volumi
     → fondo nero dominante (regola 2), folla ancora riconoscibile.
     Il filtro è STATICO: non si anima mai (regola 4). */
  .photo {
    position: absolute; inset: 0;
    background-image: url('media/crowd-night-wide.jpg');
    background-repeat: no-repeat;
    background-position: 50% 50%;
    background-size: cover;
    filter: grayscale(1) brightness(2.7) contrast(6);
    /* origine spostata verso la folla (destra, poco sopra la metà): zoomando, la
       cornice deriva di lato invece di gonfiarsi sul posto. Con scale ≥ 1.03 lo
       stage resta sempre coperto, qualunque sia l'origine. */
    transform-origin: 62% 46%;
  }

  /* ── il blocco ───────────────────────────────────────────────────────────────
     Larghezza 620px = 60% dello stage, a filo dei margini di collezione (34px).
     Altezza dal contenuto: padding-bottom 84 = 26 (quota meta) + 18 (riga meta)
     + 40 d'aria. Il fondo nero è un elemento a parte (.ink) perché la sua
     scaleY non deve MAI schiacciare il testo. */
  .panel {
    position: absolute; left: 34px; bottom: 34px;
    width: 620px; padding: 44px 34px 84px;
  }
  .ink {
    position: absolute; inset: 0; background: var(--bg);
    transform: scaleY(0); transform-origin: 50% 100%;
  }

  /* corpo di partenza: il valore definitivo lo fissa il JS misurando la colonna */
  .phrase { position: relative; z-index: 1; font-size: 92px; }

  /* la firma vive DENTRO il blocco: fuori, su una stampa a soglia, il muted
     sparirebbe. Allineata alla colonna del testo (34px = padding del blocco). */
  .foot {
    position: absolute; left: 34px; right: 34px; bottom: 26px;
    overflow: hidden; z-index: 1;
  }
  .foot .meta { position: static; left: auto; right: auto; bottom: auto; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div class="photo"></div>
    <div class="panel">
      <div class="ink"></div>
      <div class="just phrase" data-lines="SIAMO|ANCORA|QUI" aria-label="Siamo ancora qui"></div>
      <div class="foot"><div class="meta"><span>Dal 2017</span><span>Ottava edizione</span></div></div>
    </div>
  </div>
</div>

<script src="vendor/gsap.min.js"></script>
<script src="vendor/CustomEase.min.js"></script>
<script src="_shared.js"></script>
<script>
LW.ready(function () {
  var phrase = document.querySelector('.phrase');
  var photo  = document.querySelector('.photo');
  var ink    = document.querySelector('.ink');
  var meta   = document.querySelector('.foot .meta');

  /* 1 · le righe, costruite a mano con la stessa struttura di LW.justify.
       Qui l'a-capo è una scelta di composizione, non il wrapping del browser:
       una parola per riga, quindi tre righe mono-parola = lettere distribuite
       edge-to-edge (modello poster). L'aria cresce scendendo — ANCORA stretta,
       QUI larghissima: la frase si allunga come un respiro. */
  phrase.innerHTML = phrase.dataset.lines.split('|').map(function (w) {
    return '<span class="lnmask"><span class="ln">' +
      w.split('').map(function (c) { return '<span class="wd">' + c + '</span>'; }).join('') +
      '</span></span>';
  }).join('');
  var lines = [].slice.call(phrase.querySelectorAll('.ln'));

  /* 2 · fit del corpo sulla colonna (font reale caricato ⇒ misure vere).
       Target: la riga più larga occupa il 73% della colonna, cioè ~0.33em d'aria
       nei suoi gap — il valore dei poster. Tutto in px scalati: colonna e
       inchiostro si misurano allo stesso modo, il rapporto è scala-invariante. */
  var col = phrase.getBoundingClientRect().width, worst = 0;
  lines.forEach(function (ln) {
    var s = 0;
    [].slice.call(ln.children).forEach(function (k) { s += k.getBoundingClientRect().width; });
    if (s > worst) worst = s;
  });
  if (worst > 0) {
    var fs = Math.round(92 * (0.73 * col) / worst);
    phrase.style.fontSize = Math.max(72, Math.min(104, fs)) + 'px';
  }

  /* 3 · ciclo 30s. Griglia ritmica 0.6s. */
  var tl = gsap.timeline({ repeat: -1 });

  /* stato iniziale — ri-applicato a ogni giro: ultimo frame ≡ primo frame */
  tl.set(photo, { scale: 1.03 });
  tl.set(ink,   { scaleY: 0 });
  tl.set(lines, { yPercent: 110 });
  tl.set(meta,  { yPercent: 110 });

  /* moto continuo: la stampa non si ferma mai (è lei a respirare durante la
     tenuta del testo). 15s d'andata + 15s di ritorno = esattamente il master,
     quindi torna a 1.03 con velocità zero. 7% in 15s ≈ 5px/s ai bordi. */
  tl.to(photo, { scale: 1.10, duration: 15, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0);

  /* la marea nera sale dal fondo … */
  tl.to(ink, { scaleY: 1, duration: 1.2, ease: 'soso' }, 0);
  /* … e le parole salgono con lei, dal basso verso l'alto (stagger 'end') */
  tl.to(lines, { yPercent: 0, duration: 0.9,  ease: 'soso', stagger: { each: 0.12, from: 'end' } }, 1.2);
  tl.to(meta,  { yPercent: 0, duration: 0.75, ease: 'soso' }, 1.8);

  /* tenuta 2.55 → 25.2: il blocco è pietra, dietro la folla continua a muoversi */

  /* uscita: prima le parole ricadono nella maschera (dall'alto in giù), il nero
     le copre ancora tutte; solo dopo la marea si ritira */
  tl.to(meta,  { yPercent: 110, duration: 0.5, ease: 'power2.in' }, 25.2);
  tl.to(lines, { yPercent: 110, duration: 0.6, ease: 'power2.in', stagger: 0.08 }, 25.2);
  tl.to(ink,   { scaleY: 0,     duration: 0.6, ease: 'power3.in' }, 26.4);
  /* 27.0 → 30.0 · tre secondi di sola stampa, poi il loop riparte */

  window.TL = tl; /* per scrub/verifica deterministica */
});
</script>
</body>
</html>
