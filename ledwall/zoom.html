<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Sottosopra — Ledwall · Zoom infinito</title>
<link rel="stylesheet" href="_shared.css">
<style>
  /* «ZOOM INFINITO» — la parola nasce piccolissima al centro, cresce fino a
     uscire dal frame, e dentro di lei ne è già nata un'altra: un tunnel senza
     inizio né fine. Ipnotico per costruzione (Wannerstedt: la periodicità
     matematica perfetta è ciò che rilassa), e il loop è esatto perché i quattro
     strati sono la stessa animazione sfasata di un quarto di ciclo.
     Moto continuo in CSS: gira liscio anche quando il rAF viene strozzato. */

  .tunnel { position: absolute; inset: 0; display: grid; place-items: center; }

  .ring {
    position: absolute;
    white-space: nowrap;
    font-size: 150px; line-height: 1; text-transform: uppercase;
    animation: grow 12s linear infinite;
    will-change: transform, opacity;
  }
  .ring:nth-child(1) { animation-delay:  0s; }
  .ring:nth-child(2) { animation-delay: -4s; }
  .ring:nth-child(3) { animation-delay: -8s; }

  /* Scala esponenziale: ogni strato percorre un'ottava, così quando esce è
     dove entra quello dietro → nessun salto. La finestra di visibilità è
     STRETTA di proposito: con quattro strati sempre accesi il tunnel diventava
     un groviglio illeggibile da lontano (verificato a schermo). */
  @keyframes grow {
    0%   { transform: scale(0.16); opacity: 0; }
    22%  { opacity: 1; }
    62%  { opacity: 1; }
    88%  { opacity: 0; }
    100% { transform: scale(3.4); opacity: 0; }
  }

  /* TUTTE in outline: da piene, gli strati grandi diventavano un muro bianco che
     copriva il tunnel (e sparava luce sul palco). Il contorno dà profondità e
     tiene la superficie accesa al minimo. Mai sotto i 3px: sul LED sfarfalla. */
  .ring {
    color: transparent;
    -webkit-text-stroke: 3px var(--fg);
  }

  .center {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    font-size: 15px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--muted);
    mix-blend-mode: difference;   /* resta leggibile anche quando una parola ci passa sopra */
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div class="tunnel">
      <div class="ring">Sottosopra</div>
      <div class="ring">Sottosopra</div>
      <div class="ring">Sottosopra</div>
    </div>
    <div class="center">Cambia il punto di vista</div>
  </div>
</div>

<script src="_shared.js"></script>
<script>
LW.ready(function () {
  /* niente GSAP: il tunnel è moto continuo puro, il CSS lo tiene meglio.
     Qui si fa solo il fit: la parola alla scala 1 deve stare in larghezza,
     così l'ottava di crescita resta la stessa per tutti gli strati. */
  var rings = [].slice.call(document.querySelectorAll('.ring'));
  var sc = LW.stageScale() || 1, fs = 150, guard = 0;
  while (rings[0].getBoundingClientRect().width / sc > 900 && fs > 60 && guard++ < 40) {
    fs -= 6;
    rings.forEach(function (r) { r.style.fontSize = fs + 'px'; });
  }
});
</script>
</body>
</html>
