<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Sottosopra — Biglietto Giardino</title>
<link rel="stylesheet" href="_shared.css">
<link rel="stylesheet" href="_mappa.css">
<style>
  /* Story unica: urgenza + novità + limite + mappa + dove si compra + il P.S.
     Sei informazioni in una story sola: la gerarchia fa tutto il lavoro —
     un solo titolone, il resto scende di peso man mano che diventa dettaglio. */

  .scene { position: absolute; left: 0; right: 0; padding: 0 72px;
           top: 232px; bottom: 372px; display: flex; flex-direction: column; justify-content: center; }

  .kick { overflow: hidden; margin-bottom: 20px; }
  .kick span { display: block; font-size: 34px; letter-spacing: 0.18em; text-transform: uppercase; }

  #claim { font-size: 92px; margin-bottom: 30px; }

  /* l'annuncio vero: in Inter, perché è testo da leggere */
  .intro { font-family: 'Inter', sans-serif; font-size: 34px; line-height: 1.34;
           letter-spacing: 0; text-transform: none; margin-bottom: 30px; }
  .intro b { font-weight: 700; }

  /* dove si compra: riga invertita, come le call del sito */
  .vendita { background: var(--fg); color: var(--bg); margin-top: 22px;
             padding: 20px 26px; font-size: 38px; letter-spacing: 0.1em;
             text-transform: uppercase; display: flex; justify-content: space-between;
             align-items: baseline; overflow: hidden; }
  .vmask { overflow: hidden; }

  .ps { font-family: 'Inter', sans-serif; font-size: 27px; line-height: 1.35;
        letter-spacing: 0; text-transform: none; color: var(--muted); margin-top: 18px; }

  .foot { bottom: 190px; }
  .foot img { width: 520px; }
</style>
</head>
<body class="reel">
<div id="wrap">
  <div id="stage">
    <div class="scene">
      <div class="kick"><span id="kick"></span></div>
      <div class="just" id="claim" data-text=""></div>
      <div class="intro" id="intro"></div>

      <div class="mapwrap" id="mapwrap"></div>
      <div class="legenda" id="legenda"></div>

      <div class="vendita"><span class="vmask"><span id="vendita"></span></span></div>
      <div class="ps" id="ps"></div>
    </div>

    <div class="foot">
      <div class="fmask"><img src="media/sottosopra-logo-black.png" alt="Sottosopra"></div>
    </div>

    <div class="safe">
      <i style="top:0;height:250px"></i>
      <i style="bottom:0;height:200px"></i>
    </div>
  </div>
</div>

<script src="vendor/gsap.min.js"></script>
<script src="vendor/CustomEase.min.js"></script>
<script src="_giardino.js"></script>
<script src="_mappa.js"></script>
<script src="_shared.js"></script>
<script>
SG.ready(function () {
  var G = window.GIARDINO;

  document.getElementById('kick').textContent = G.giorno;
  document.getElementById('intro').innerHTML = G.intro;
  document.getElementById('mapwrap').innerHTML = MAPPA.svg();
  document.getElementById('vendita').innerHTML = G.vendita;
  document.getElementById('ps').innerHTML = G.ps;
  document.getElementById('legenda').innerHTML = G.legenda.map(function (r) {
    return '<div class="lr"><span class="sw ' + r[0] + '"></span>' +
           '<span class="t">' + r[1] + '</span>' +
           '<span class="k">' + r[2] + '</span></div>';
  }).join('');

  /* claim giustificato, con rientro di corpo se sfora in larghezza */
  var el = document.getElementById('claim');
  el.setAttribute('data-text', G.claim);
  el.textContent = G.claim;
  var lines = SG.justify(el), guard = 0;
  while (guard++ < 30) {
    var box = el.getBoundingClientRect(), over = false;
    [].slice.call(el.querySelectorAll('.ln')).forEach(function (ln) {
      var ink = [].slice.call(ln.children).reduce(function (a, k) {
        return a + k.getBoundingClientRect().width; }, 0);
      if (ink > box.width + 1) over = true;
    });
    if (!over) break;
    el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * 0.94).toFixed(1) + 'px';
    el.removeAttribute('data-text');
    el.textContent = G.claim;
    lines = SG.justify(el);
  }
  SG.capAir(lines);

  /* se sfora in ALTEZZA si stringe il claim: la mappa non si tocca */
  var scene = document.querySelector('.scene'), sc = SG.stageScale() || 1, g2 = 0;
  while (g2++ < 20) {
    var need = 0;
    [].slice.call(scene.children).forEach(function (c) {
      need += c.getBoundingClientRect().height / sc;
      need += parseFloat(getComputedStyle(c).marginBottom) || 0;
      need += parseFloat(getComputedStyle(c).marginTop) || 0;
    });
    if (need <= scene.getBoundingClientRect().height / sc) break;
    el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * 0.93).toFixed(1) + 'px';
    el.removeAttribute('data-text');
    el.textContent = G.claim;
    lines = SG.justify(el);
    SG.capAir(lines);
  }

  lines.forEach(function (ln) {
    var d = SG.packDeltas(ln);
    [].slice.call(ln.children).forEach(function (wd, i) { wd._dx = d[i] || 0; });
  });

  var wds  = [].slice.call(el.querySelectorAll('.wd'));
  var kick = document.getElementById('kick');
  var intro = document.getElementById('intro');
  var lr   = [].slice.call(document.querySelectorAll('.legenda .lr'));
  var vend = document.querySelector('.vendita');
  var vtxt = document.getElementById('vendita');
  var ps   = document.getElementById('ps');
  var foot = [].slice.call(document.querySelectorAll('.foot .fmask > *'));

  var tl = gsap.timeline();
  tl.set(kick, { yPercent: 110 });
  tl.set(lines, { yPercent: 110 });
  tl.set(wds, { x: function (i, t) { return t._dx || 0; } });
  tl.set(intro, { opacity: 0, y: 14 });
  tl.set(lr, { opacity: 0, x: -14 });
  tl.set(vend, { scaleX: 0, transformOrigin: '0% 50%' });
  tl.set(vtxt, { opacity: 0 });
  tl.set(ps, { opacity: 0 });
  tl.set(foot, { yPercent: 110 });

  tl.to(kick, { yPercent: 0, duration: 0.5, ease: 'soso' }, 0);
  tl.to(lines, { yPercent: 0, duration: 0.7, ease: 'soso', stagger: 0.08 }, 0.1);
  tl.to(wds, { x: 0, duration: 0.9, ease: 'expo.inOut', stagger: 0.01 }, 0.4);
  tl.to(intro, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 0.85);

  MAPPA.anima(tl, 1.25);   /* la mappa chiude a 1.25 + 2.6 = 3.85 */

  tl.to(lr, { opacity: 1, x: 0, duration: 0.45, ease: 'power2.out', stagger: 0.09 }, 3.9);
  /* la riga «dove si compra» si apre come una barra: è l'ultima azione */
  tl.to(vend, { scaleX: 1, duration: 0.6, ease: 'soso' }, 4.15);
  tl.to(vtxt, { opacity: 1, duration: 0.35 }, 4.5);
  tl.to(ps, { opacity: 1, duration: 0.45 }, 4.7);
  tl.to(foot, { yPercent: 0, duration: 0.6, ease: 'soso' }, 4.85);

  window.TL = tl;
  setTimeout(function () { if (!SG.frozen && tl.time() < 1) tl.progress(1); }, 6200);
});
</script>
</body>
</html>
