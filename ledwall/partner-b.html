<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Sottosopra — Ledwall · Partner (uno alla volta)</title>
<link rel="stylesheet" href="_shared.css">
<style>
  /* due atti nello stesso stage: il secondo dorme finché non tocca a lui */
  #p1, #p2 { position: absolute; inset: 0; }
  #p2 { visibility: hidden; }

  .lb  { position: absolute; left: 34px; top: 34px; }
  .ttl { position: absolute; left: 34px; right: 34px; top: 76px; }

  /* ── ATTO 1 · title card: un main partner per volta, al centro ── */
  .stack { position: absolute; left: 34px; right: 34px; top: 200px; bottom: 100px;
           display: grid; place-items: center; }
  .card  { grid-area: 1 / 1; visibility: hidden; }
  .mask  { display: block; overflow: hidden; line-height: 0; }
  .mask img { display: block; filter: invert(1); }

  /* indicatore di posizione: sei trattini, l'attivo è bianco pieno */
  .ticks { position: absolute; left: 34px; bottom: 34px; display: flex; gap: 10px; }
  .tick  { width: 24px; height: 3px; background: var(--line); position: relative; overflow: hidden; }
  .tick span { position: absolute; inset: 0; background: var(--fg); opacity: 0; }

  /* ── ATTO 2 · il muro fitto di tutti gli altri ── */
  .grid { position: absolute; left: 34px; right: 34px; top: 210px; height: 445px;
          display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr);
          column-gap: 20px; row-gap: 15px; }
  .cell { display: grid; place-items: center; }
  .cell img { display: block; filter: invert(1); }
  .cell .txt { font-size: 20px; letter-spacing: 0.02em; text-transform: uppercase;
               white-space: nowrap; line-height: 1; color: var(--fg); }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">

    <section id="p1">
      <div class="label lb" id="lb1">Main partner</div>
      <div class="ttl"><div class="just" id="t1" style="font-size:64px" data-text="Lo rendono possibile"></div></div>
      <div class="stack" id="stack"></div>
      <div class="ticks" id="ticks"></div>
    </section>

    <section id="p2">
      <div class="label lb" id="lb2">Partner · Supporter · Partner tecnici</div>
      <div class="ttl"><div class="just" id="t2" style="font-size:80px" data-text="Grazie anche a"></div></div>
      <div class="grid" id="grid"></div>
    </section>

  </div>
</div>

<script src="vendor/gsap.min.js"></script>
<script src="vendor/CustomEase.min.js"></script>
<script src="_shared.js"></script>
<script>
(function () {
  /* ── partner 2026 (fonte: src/content/sponsors.yaml del sito) ── */
  var MAIN = ['prodeco', 'banca-terre-venete', 'cna', 'super-agency', 'azimut', 'ceccato'];
  var REST = [
    /* partner */          'adriatica-strade', 'merieux', 'ferro', 'got-bag',
    /* supporter */        'vudafieri', 'zurich-spadavecchia', 'fraccaro', 'permatech', 'jb-baggio',
                           'ots-sistemi', 'noi-group', 'banda-bistrot', 'brewrise', 'dentro-centro',
    /* partner tecnici */  'santi-autotrasporti', 'hotel-alla-torre', 'albergo-roma', 'proloco-castelfranco',
                           'santi-group', 'officine-tonello', 'piu-service', 'via-vai', 'citta-invisibile',
                           'despar', 'TEXT:Studio Fiscon'
  ];

  var stack = document.getElementById('stack');
  var ticks = document.getElementById('ticks');
  var grid  = document.getElementById('grid');
  var booted = false;

  /* ── DOM ── */
  MAIN.forEach(function (id) {
    var card = document.createElement('div'); card.className = 'card';
    var mask = document.createElement('div'); mask.className = 'mask';
    var img  = document.createElement('img'); img.src = 'logos/' + id + '.png'; img.alt = id;
    mask.appendChild(img); card.appendChild(mask); stack.appendChild(card);

    var t = document.createElement('div'); t.className = 'tick';
    t.appendChild(document.createElement('span')); ticks.appendChild(t);
  });

  REST.forEach(function (id) {
    var cell = document.createElement('div'); cell.className = 'cell';
    if (id.indexOf('TEXT:') === 0) {
      var s = document.createElement('span'); s.className = 'txt';
      s.textContent = id.slice(5); cell.appendChild(s);
    } else {
      var im = document.createElement('img'); im.src = 'logos/' + id + '.png'; im.alt = id;
      cell.appendChild(im);
    }
    grid.appendChild(cell);
  });

  var cards    = [].slice.call(stack.querySelectorAll('.card'));
  var cardImgs = [].slice.call(stack.querySelectorAll('.mask img'));
  var tickOns  = [].slice.call(ticks.querySelectorAll('.tick span'));
  var cells    = [].slice.call(grid.querySelectorAll('.cell'));
  var allImgs  = [].slice.call(document.querySelectorAll('#stage img'));

  /* normalizzazione ad AREA percettiva (stessa formula del PartnerLedger del sito):
     h = base * sqrt(2.8 / AR), clamp [0.5, 1.3] · base, poi tetto di larghezza e altezza.
     Mai deformare: si imposta solo l'altezza, la larghezza segue. */
  function norm(img, base, maxW, maxH) {
    var nw = img.naturalWidth, nh = img.naturalHeight;
    var ar = (nw && nh) ? nw / nh : 2.8;
    var k = Math.min(1.3, Math.max(0.5, Math.sqrt(2.8 / ar)));
    var h = base * k;
    if (h * ar > maxW) h = maxW / ar;   /* i loghi lunghissimi (Ceccato 10:1) restano dentro lo stage */
    if (h > maxH) h = maxH;
    img.style.height = Math.round(h) + 'px';
  }

  function boot() {
    if (booted) return;
    booted = true;

    /* ATTO 1: giganti — box utile 966×389, max 231×900 · ATTO 2: cella 177×77, max 62×172 */
    cardImgs.forEach(function (im) { norm(im, 230, 900, 250); });
    [].slice.call(grid.querySelectorAll('img')).forEach(function (im) { norm(im, 48, 170, 66); });

    /* titoli giustificati + delta "compatto → giustificato" (l'aria che si apre) */
    function prep(el, host) {
      var vis = host.style.visibility;
      host.style.visibility = 'visible';
      var lines = LW.justify(el);
      lines.forEach(function (line) {
        var d = LW.packDeltas(line);
        [].slice.call(line.children).forEach(function (wd, i) { wd._dx = d[i]; });
      });
      host.style.visibility = vis;
      return {
        lines: lines,
        words: [].slice.call(el.querySelectorAll('.wd'))
      };
    }
    var p1 = document.getElementById('p1'), p2 = document.getElementById('p2');
    var T1 = prep(document.getElementById('t1'), p1);
    var T2 = prep(document.getElementById('t2'), p2);

    var lb1 = document.getElementById('lb1'), lb2 = document.getElementById('lb2');
    var dx = function (i, t) { return t._dx || 0; };

    var tl = gsap.timeline({ repeat: -1 });

    /* ── stato zero (ri-applicato a ogni giro: il loop chiude sul nero) ── */
    tl.set(T1.lines, { yPercent: 110 }, 0);
    tl.set(T1.words, { x: dx }, 0);
    tl.set(lb1, { opacity: 0 }, 0);
    tl.set(ticks, { opacity: 0 }, 0);
    tl.set(tickOns, { opacity: 0 }, 0);
    tl.set(stack, { scale: 1 }, 0);
    tl.set(cards, { visibility: 'hidden', scale: 1 }, 0);
    tl.set(cardImgs, { yPercent: 110 }, 0);
    tl.set(p2, { visibility: 'hidden' }, 0);
    tl.set(T2.lines, { yPercent: 110 }, 0);
    tl.set(T2.words, { x: dx }, 0);
    tl.set(lb2, { opacity: 0 }, 0);
    tl.set(grid, { scale: 1 }, 0);
    tl.set(cells, { opacity: 0, y: 16, scale: 0.94 }, 0);

    /* ══ ATTO 1 · 0 → 15.0 — i main partner, uno alla volta, giganti ══ */
    tl.to(T1.lines, { yPercent: 0, duration: 0.85, ease: 'soso', stagger: 0.1 }, 0);
    tl.to(T1.words, { x: 0, duration: 1.1, ease: 'expo.inOut', stagger: 0.012 }, 0.45);
    tl.to(lb1, { opacity: 1, duration: 0.8, ease: 'soso' }, 0.25);
    tl.to(ticks, { opacity: 1, duration: 0.7, ease: 'soso' }, 0.55);
    /* respiro continuo dell'atto: 6 mezzi cicli da 2.4s → torna esatto a 1 alle 15.0 */
    tl.to(stack, { scale: 1.006, duration: 2.4, ease: 'sine.inOut', yoyo: true, repeat: 5 }, 0.6);

    /* sei title card da 2.4s (4 battute sulla griglia da 0.6s):
       entra dal basso sotto maschera → tiene → esce verso l'alto proprio mentre parte la successiva */
    MAIN.forEach(function (id, i) {
      var t0 = 0.6 + i * 2.4;
      tl.set(cards[i], { visibility: 'visible' }, t0);
      tl.fromTo(cardImgs[i], { yPercent: 110 },
        { yPercent: 0, duration: 0.85, ease: 'soso', immediateRender: false }, t0);
      tl.fromTo(cards[i], { scale: 1.03 },
        { scale: 1, duration: 1.3, ease: 'soso', immediateRender: false }, t0);
      tl.to(cardImgs[i], { yPercent: -118, duration: 0.6, ease: 'power2.in' }, t0 + 1.8);
      tl.set(cards[i], { visibility: 'hidden' }, t0 + 2.4);

      tl.to(tickOns[i], { opacity: 1, duration: 0.6, ease: 'soso' }, t0);
      if (i > 0) tl.to(tickOns[i - 1], { opacity: 0, duration: 0.6, ease: 'power2.in' }, t0);
    });

    tl.to([lb1, ticks], { opacity: 0, duration: 0.6, ease: 'power2.in' }, 13.9);
    tl.to(T1.lines, { yPercent: -115, duration: 0.6, ease: 'power2.in' }, 13.95);
    /* 15.0 → 15.4: respiro nero fra i due atti */

    /* ══ ATTO 2 · 15.4 → 24.6 — tutti gli altri, insieme, fitti ══ */
    tl.set(p2, { visibility: 'visible' }, 15.4);
    tl.to(T2.lines, { yPercent: 0, duration: 0.85, ease: 'soso', stagger: 0.1 }, 15.4);
    tl.to(T2.words, { x: 0, duration: 1.1, ease: 'expo.inOut', stagger: 0.012 }, 15.85);
    tl.to(lb2, { opacity: 1, duration: 0.7, ease: 'soso' }, 15.8);
    tl.to(cells, { opacity: 1, y: 0, scale: 1, duration: 0.75, ease: 'soso',
      stagger: { grid: [5, 5], from: 'center', amount: 1.6 } }, 16.15);
    /* tenuta: 4 mezzi cicli da 0.9s → torna esatto a 1 alle 22.2 */
    tl.to(grid, { scale: 1.006, duration: 0.9, ease: 'sine.inOut', yoyo: true, repeat: 3 }, 18.6);

    tl.to(cells, { opacity: 0, y: -10, duration: 0.6, ease: 'power2.in',
      stagger: { grid: [5, 5], from: 'edges', amount: 0.6 } }, 22.2);
    tl.to(lb2, { opacity: 0, duration: 0.6, ease: 'power2.in' }, 22.45);
    tl.to(T2.lines, { yPercent: -115, duration: 0.6, ease: 'power2.in' }, 22.6);
    tl.set(p2, { visibility: 'hidden' }, 23.4);
    tl.to({}, { duration: 1.2 }, 23.4);   /* coda nera: ultimo frame ≡ primo (si concatena) */

    window.TL = tl;
  }

  LW.ready(function () {
    /* servono le proporzioni reali dei loghi: aspetta la decodifica, ma non all'infinito */
    var decoded = Promise.all(allImgs.map(function (i) {
      return i.decode ? i.decode().catch(function () {}) : Promise.resolve();
    }));
    var capped = new Promise(function (res) { setTimeout(res, 2500); });
    Promise.race([decoded, capped]).then(boot);
  });

  /* guardiano: se l'intro non è partita (rAF strozzato o font/immagini appesi),
     dopo 3s costruisce comunque e porta lo stage su un frame leggibile */
  setTimeout(function () {
    boot();
    if (window.TL && window.TL.time() < 0.4) window.TL.seek(1.8);
  }, 3000);
})();
</script>
</body>
</html>
