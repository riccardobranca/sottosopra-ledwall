<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Sottosopra — Ledwall · Istituzioni</title>
<link rel="stylesheet" href="_shared.css">
<style>
  /* «ISTITUZIONI» — la scena del patrocinio. Registro sobrio e rispettoso:
     le diciture ufficiali sono riportate ALLA LETTERA (fonte: PartnerLedger del
     sito) e restano leggibili a lungo. Niente gesti brillanti: qui il gesto è
     la compostezza. Un blocco per volta, tutto lo spazio a sua disposizione. */

  .card {
    position: absolute; inset: 60px 34px 78px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    visibility: hidden;
  }

  /* la dicitura ufficiale: mai abbreviata, mai riscritta */
  .card .dicitura {
    max-width: 880px;
    font-size: 27px; line-height: 1.5; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted);
  }
  .dmask { overflow: hidden; }

  .logowrap { overflow: hidden; margin: 44px 0 0; }
  .card img {
    display: block;
    filter: invert(1);          /* i loghi sono grigi su bianco → bianco su nero */
  }

  /* intestazione fissa: la scena si annuncia una volta sola, in piccolo */
  .kicker {
    position: absolute; left: 34px; top: 30px;
    font-size: 15px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--muted);
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div class="kicker">Sottosopra 2026</div>

    <div class="card">
      <div class="dmask"><div class="dicitura">Con il Patrocinio di</div></div>
      <div class="logowrap"><img src="logos/citta-castelfranco.png" alt="Città di Castelfranco Veneto" style="height:190px"></div>
    </div>

    <div class="card">
      <div class="dmask"><div class="dicitura">Progetto realizzato in collaborazione e con il contributo della Camera di commercio di Treviso-Belluno</div></div>
      <div class="logowrap"><img src="logos/camera-commercio.png" alt="Camera di commercio di Treviso-Belluno" style="height:120px"></div>
    </div>

    <div class="meta"><span>Sottosopra APS</span><span>Castelfranco Veneto</span></div>
  </div>
</div>

<script src="vendor/gsap.min.js"></script>
<script src="vendor/CustomEase.min.js"></script>
<script src="_shared.js"></script>
<script>
LW.ready(function () {
  var cards = [].slice.call(document.querySelectorAll('.card'));

  /* i loghi hanno proporzioni molto diverse: se uno sfora in larghezza,
     si riduce l'altezza finché entra (mai deformare un logo istituzionale) */
  var MAXW = 700, sc = LW.stageScale() || 1;
  cards.forEach(function (c) {
    var img = c.querySelector('img');
    var h = parseFloat(img.style.height);
    var guard = 0;
    while (img.getBoundingClientRect().width / sc > MAXW && h > 60 && guard++ < 40) {
      h -= 6; img.style.height = h + 'px';
    }
  });

  var tl = gsap.timeline({ repeat: -1 });

  cards.forEach(function (card) {
    var dic = card.querySelector('.dicitura');
    var img = card.querySelector('img');

    tl.set(card, { visibility: 'visible' });
    tl.set(dic, { yPercent: 110 });
    tl.set(img, { yPercent: 110 });

    /* la dicitura prima, il logo dopo: si legge chi ringrazia, poi chi è ringraziato */
    tl.to(dic, { yPercent: 0, duration: 0.9, ease: 'soso' });
    tl.to(img, { yPercent: 0, duration: 0.9, ease: 'soso' }, '-=0.5');

    /* tenuta lunga: una dicitura istituzionale va letta con calma.
       Respiro appena percettibile — la scena non è mai del tutto ferma. */
    tl.to(card, { scale: 1.008, duration: 3.2, ease: 'sine.inOut', yoyo: true, repeat: 1 });

    tl.to([dic, img], { yPercent: -110, duration: 0.5, ease: 'power2.in', stagger: 0.06 });
    tl.set(card, { visibility: 'hidden' });
    tl.to({}, { duration: 0.5 }); /* nero tra le due */
  });

  window.TL = tl;
});
</script>
</body>
</html>
