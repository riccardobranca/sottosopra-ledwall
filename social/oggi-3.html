<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Sottosopra — Oggi · 3</title>
<link rel="stylesheet" href="_shared.css">
<style>
  /* «LA PIANTA» · opzione 3 — la zona parterre disegnata dall'alto: la fascia
     del palco e, sotto, il rettangolo che si riempie a partire dal palco.
     È la variante che non lascia dubbi su COSA sia la percentuale: non un
     numero astratto, ma uno spazio fisico che si sta occupando. */

  .scene { position: absolute; left: 0; right: 0; padding: 0 72px;
           top: 250px; bottom: 470px; display: flex; flex-direction: column; justify-content: center; }

  .kick { overflow: hidden; margin-bottom: 24px; }
  .kick span { display: block; font-size: 36px; letter-spacing: 0.18em; text-transform: uppercase; }

  #titolo { font-size: 104px; margin-bottom: 40px; }

  /* la pianta */
  .palco { background: var(--fg); color: var(--bg); height: 66px;
           display: flex; align-items: center; justify-content: center;
           font-size: 30px; letter-spacing: 0.34em; text-transform: uppercase; }
  /* stacco generoso dal palco: senza, il campo pieno e la fascia del palco
     si fondono in un unico blocco nero e la pianta non si legge più */
  .campo { position: relative; height: 290px; margin-top: 26px;
           border: 3px solid var(--fg); overflow: hidden; }
  .campo .riemp { position: absolute; inset: 0; background: var(--fg);
                  transform-origin: 50% 0%; transform: scaleY(0); }

  .dato { display: flex; align-items: baseline; justify-content: space-between; margin-top: 18px; }
  .dato .k { font-size: 26px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .dato .p { font-size: 86px; line-height: 0.9; }
  .dato .p em { font-style: normal; font-size: 0.44em; }
  .dmask { overflow: hidden; }

  .live { margin-top: 46px; display: flex; flex-direction: column; gap: 10px; }
  .live .nm { font-size: 44px; line-height: 1; text-transform: uppercase; display: block; }
  .nmask { overflow: hidden; }

  .foot { position: absolute; left: 72px; right: 72px; bottom: 290px;
          display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .foot img { display: block; width: 600px; }
  .fmask { overflow: hidden; }
</style>
</head>
<body class="reel">
<div id="wrap">
  <div id="stage">
    <div class="scene">
      <div class="kick"><span id="kick"></span></div>
      <div class="just" id="titolo" data-text=""></div>

      <div class="palco" id="palco">Palco</div>
      <div class="campo"><div class="riemp"></div></div>
      <div class="dato">
        <span class="dmask"><span class="k" id="barlab"></span></span>
        <span class="dmask"><span class="p" id="pct"></span></span>
      </div>

      <div class="live" id="live"></div>
    </div>

    <div class="foot">
      <div class="fmask"><img src="media/sottosopra-logo-black.png" alt="Sottosopra"></div>
    </div>

    <div class="safe">
      <i style="top:0;height:250px"></i>
      <i style="bottom:0;height:200px"></i>
    </div>
  </div>
</div>

<script src="vendor/gsap.min.js"></script>
<script src="vendor/CustomEase.min.js"></script>
<script src="_oggi.js"></script>
<script src="_shared.js"></script>
<script>
SG.ready(function () {
  var O = window.OGGI;

  document.getElementById('kick').textContent = O.giorno;
  document.getElementById('pct').innerHTML = O.pct + '<em>%</em>';
  document.getElementById('barlab').textContent = O.metrica;
  document.getElementById('live').innerHTML = O.live.map(function (n) {
    return '<div class="nmask"><div class="nm just" data-text="' + n + '"></div></div>';
  }).join('');

  var tEl = document.getElementById('titolo');
  tEl.setAttribute('data-text', O.zona);
  tEl.textContent = O.zona;
  var lines = SG.justify(tEl);
  var guard = 0;
  while (guard++ < 30) {
    var box = tEl.getBoundingClientRect(), over = false;
    [].slice.call(tEl.querySelectorAll('.ln')).forEach(function (ln) {
      var ink = [].slice.call(ln.children).reduce(function (a, k) {
        return a + k.getBoundingClientRect().width; }, 0);
      if (ink > box.width + 1) over = true;
    });
    if (!over) break;
    tEl.style.fontSize = (parseFloat(getComputedStyle(tEl).fontSize) * 0.94).toFixed(1) + 'px';
    tEl.removeAttribute('data-text');
    tEl.textContent = O.zona;
    lines = SG.justify(tEl);
  }
  SG.capAir(lines);

  var nameEls = [].slice.call(document.querySelectorAll('.live .nm'));
  var nameLines = [];
  nameEls.forEach(function (el) { nameLines = nameLines.concat(SG.justify(el)); });
  SG.capAir(nameLines, 1);   /* i nomi restano compatti: distribuiti a lettere diventano illeggibili */

  var kick  = document.getElementById('kick');
  var palco = document.getElementById('palco');
  var campo = document.querySelector('.campo');
  var riemp = document.querySelector('.riemp');
  var lab   = document.getElementById('barlab');
  var pEl   = document.getElementById('pct');
  var foot  = [].slice.call(document.querySelectorAll('.foot .fmask > *'));

  var tl = gsap.timeline();
  tl.set(kick, { yPercent: 110 });
  tl.set(lines, { yPercent: 110 });
  tl.set(palco, { scaleX: 0, transformOrigin: '0% 50%' });
  tl.set(campo, { opacity: 0 });
  tl.set(riemp, { scaleY: 0 });
  tl.set([lab, pEl], { yPercent: 110 });
  tl.set(nameLines, { yPercent: 110 });
  tl.set(foot, { yPercent: 110 });

  tl.to(kick, { yPercent: 0, duration: 0.5, ease: 'soso' }, 0);
  tl.to(lines, { yPercent: 0, duration: 0.7, ease: 'soso', stagger: 0.08 }, 0.1);
  /* prima il palco, poi il campo: si costruisce la pianta, poi la si riempie */
  tl.to(palco, { scaleX: 1, duration: 0.6, ease: 'soso' }, 0.55);
  tl.to(campo, { opacity: 1, duration: 0.3 }, 0.85);
  tl.to(riemp, { scaleY: O.pct / 100, duration: 1.3, ease: 'power3.out' }, 1.0);
  tl.to([lab, pEl], { yPercent: 0, duration: 0.55, ease: 'soso', stagger: 0.06 }, 1.75);
  tl.to(nameLines, { yPercent: 0, duration: 0.6, ease: 'soso', stagger: 0.09 }, 1.95);
  tl.to(foot, { yPercent: 0, duration: 0.6, ease: 'soso' }, 2.3);

  window.TL = tl;
  setTimeout(function () { if (!SG.frozen && tl.time() < 1) tl.progress(1); }, 3200);
});
</script>
</body>
</html>
