<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Sottosopra — Ledwall · Un giorno non basta (Full Pass)</title>
<link rel="stylesheet" href="_shared.css">
<style>
  /* Lo stato di RIPOSO del CSS è la scena PIENA e leggibile: se il rAF viene
     strozzato (scheda in background, iframe della galleria) il muro mostra
     comunque il poster. È la timeline a nascondere gli elementi al proprio t=0. */

  /* titolone: due blocchi impilati, interlinea 1, nessuno stacco fra i blocchi
     («UN GIORNO NON» multi-parola = aria nei gap · «BASTA» mono-parola =
      lettere distribuite edge-to-edge) */
  #title { position: absolute; left: 34px; right: 34px; top: 76px; }
  #title .just + .just { margin-top: 0; }

  /* la riga invertita: full-bleed, 110px = 16% dello stage (non è un muro di
     luce), angoli vivi, contenuto allineato ai margini del titolone */
  #barmask { position: absolute; left: 0; right: 0; top: 420px; height: 110px; overflow: hidden; }
  #bar {
    height: 110px; background: #fff; color: #000;
    display: flex; align-items: center; padding: 0 34px;
  }
  #barrow { flex: 1; display: flex; align-items: baseline; justify-content: space-between; }
  #barrow .fp  { font-size: 62px; line-height: 1; text-transform: uppercase; white-space: nowrap; }
  #barrow .lbl { color: rgba(0, 0, 0, 0.55); white-space: nowrap; }
  #barrow .go  { font-size: 34px; line-height: 1; text-transform: uppercase; white-space: nowrap; }

  /* freccia disegnata: SoSo26 NON ha U+2197 (verificato nel woff2) → un glifo
     di ripiego cadrebbe su un altro font, o su una emoji. Tratto ≥2px reali. */
  .arw { width: 0.64em; height: 0.64em; display: inline-block; margin-left: 0.2em; vertical-align: -0.02em; }

  /* la data di oggi, in bianco dentro la meta muted */
  .meta .on { color: var(--fg); }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">

    <div id="title">
      <div class="just" id="tA" style="font-size:110px" data-text="Un giorno non"></div>
      <div class="just" id="tB" style="font-size:152px" data-text="Basta"></div>
    </div>

    <div id="barmask">
      <div id="bar">
        <div id="barrow">
          <span class="fp">Full Pass</span>
          <span class="label lbl">Tutte le serate</span>
          <span class="go">Biglietti<svg class="arw" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 17.5 L17.5 6.5 M8.5 6.5 L17.5 6.5 L17.5 15.5" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="square"/></svg></span>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="vendor/gsap.min.js"></script>
<script src="vendor/CustomEase.min.js"></script>
<script src="_shared.js"></script>
<script>
/* Giornata: ?day=gio|ven|sab|dom, altrimenti dalla data reale, fallback ven
   (stessa regola di palco.html — la data è letta in UTC come lì: dopo mezzanotte
   la serata in corso resta quella giusta).
   Questa scena NON è per-giornata (il Full Pass vale per tutte le serate): il
   giorno serve solo a marcare in bianco la data di oggi nella riga meta. */
function pickDay() {
  var q = new URLSearchParams(location.search).get('day');
  if (q && ['gio', 'ven', 'sab', 'dom'].indexOf(q) >= 0) return q;
  var iso = new Date().toISOString().slice(5, 10);
  return { '07-30': 'gio', '07-31': 'ven', '08-01': 'sab', '08-02': 'dom' }[iso] || 'ven';
}

LW.ready(function () {

  /* ── meta: le quattro date, oggi in bianco ───────────────────────────── */
  var DATES = [
    { d: 'gio', t: '30' },
    { d: 'ven', t: '31 luglio' },
    { d: 'sab', t: '1' },
    { d: 'dom', t: '2 agosto' }
  ];
  var today = pickDay();
  /* (la riga-date in fondo è stata rimossa insieme alla meta) */

  /* ── titolone: righe giustificate + delta "compatto → giustificato" ─────
     fit: se il corpo scelto facesse andare il blocco a capo, si scende finché
     entra su una riga sola (mai spezzare «UN GIORNO NON» sul muro). */
  function build(el, fs, min) {
    var lines;
    for (;;) {
      el.style.fontSize = fs + 'px';
      lines = LW.justify(el);
      if (lines.length <= 1 || fs <= min) break;
      fs -= 4;
    }
    lines.forEach(function (line) {
      var d = LW.packDeltas(line);
      [].slice.call(line.children).forEach(function (wd, i) { wd._dx = d[i]; });
    });
    return lines;
  }
  var lines = build(document.getElementById('tA'), 110, 70)
      .concat(build(document.getElementById('tB'), 152, 90));

  var title = document.getElementById('title');
  var words = [].slice.call(title.querySelectorAll('.wd'));

  /* ── riga invertita: fit di sicurezza (oggi avanzano ~260px, ma se un
     giorno il testo cambia il corpo scende invece di sbordare) ──────────── */
  var row = document.getElementById('barrow');
  var fp = row.querySelector('.fp'), go = row.querySelector('.go');
  var f1 = 62, f2 = 34;
  while (row.scrollWidth > row.clientWidth && f1 > 38) {
    f1 -= 2; fp.style.fontSize = f1 + 'px';
    if (f2 > 24) { f2 -= 1; go.style.fontSize = f2 + 'px'; }
  }

  var bar = document.getElementById('bar');

  /* ── loop 19.2s esatti · ultimo frame ≡ primo ────────────────────────────
     attacchi tutti sulla griglia ritmica da 0.6s (100 BPM), durate multiple di 0.3
     0.6 · masked line reveal dei due blocchi (ease-firma 'soso', stagger 0.12)
     1.2 · l'aria si apre: parole e lettere si distribuiscono edge-to-edge
     2.4 · il colpo: la riga invertita entra da destra e si pianta (3.6)
     3.6 · tenuta 13.2s = due respiri da 6.6s (il titolo non è mai fermo del tutto)
    16.8 · uscita: le righe salgono, la riga bianca prosegue e se ne va a sinistra
    18.0 · nero, poi si ricomincia (i set a t=0 avvengono tutti a scena vuota) */
  var T_PLACED = 3.6;   /* istante in cui tutto è in posizione */
  var tl = gsap.timeline({ repeat: -1 });

  tl.set(lines, { yPercent: 110 }, 0);
  tl.set(words, { x: function (i, t) { return t._dx || 0; } }, 0);
  tl.set(bar,   { xPercent: 100 }, 0);
  tl.set(title, { scale: 1, transformOrigin: '50% 50%' }, 0);

  tl.to(lines, { yPercent: 0, duration: 0.9, ease: 'soso', stagger: 0.12 }, 0.6);
  tl.to(words, { x: 0, duration: 1.2, ease: 'expo.inOut', stagger: 0.014 }, 1.2);
  tl.to(bar,   { xPercent: 0, duration: 1.2, ease: 'soso' }, 2.4);

  tl.to(title, { scale: 1.008, duration: 6.6, ease: 'sine.inOut', yoyo: true, repeat: 1 }, T_PLACED);

  tl.to(lines, { yPercent: -110, duration: 0.6, ease: 'power2.in', stagger: 0.06 }, 16.8);
  tl.to(bar,   { xPercent: -100, duration: 0.6, ease: 'power3.in' }, 17.4);
  tl.to({},    { duration: 1.2 }, 18.0);   /* nero: il ciclo chiude a 19.2 */

  window.TL = tl;   /* per scrub/verifica deterministica */

  /* Guardiano: se dopo 3s reali la timeline è ancora ferma sotto il secondo,
     il rAF non sta girando (pagina in un iframe di sfondo) → si salta allo
     stato "tutto in posizione". Meglio perdere l'entrata che lasciare il muro
     vuoto. La soglia bassa evita di scattare quando la timeline gira davvero
     (a 3s reali sarebbe già a ~3s). setTimeout scatta anche senza rAF. */
  setTimeout(function () {
    if (tl.totalTime() < 1) tl.totalTime(T_PLACED);
  }, 3000);
});
</script>
</body>
</html>
