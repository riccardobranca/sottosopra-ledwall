<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Sottosopra — Ledwall · Respiro</title>
<link rel="stylesheet" href="_shared.css">
<style>
  /* ── RESPIRO — la scena quieta ──
     Un solo gesto: il wordmark respira, due lame di luce lo attraversano.
     Tutto moto continuo CSS: ogni layer si wrappa perfettamente da solo;
     i cicli co-primi (13 · 17 · 23 s) fanno sì che il composito non si
     ripeta quasi mai. Nessuna GSAP timeline → niente window.TL (regola 11). */

  /* lame di luce: DIETRO al wordmark (z-index 1 < 2) */
  .blade {
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 3px;               /* ≥2px: niente shimmer LED */
    background: #fff;
    opacity: 0.5;
    z-index: 1;
    will-change: transform;
  }
  /* corsa: da appena sopra (y=-3, invisibile) ad appena sotto (y=689,
     invisibile) → il wrap avviene fuori scena, zero scatto percepibile */
  @keyframes blade-fall {
    from { transform: translate3d(0, -3px, 0); }
    to   { transform: translate3d(0, 689px, 0); }
  }
  .blade--a { animation: blade-fall 17s linear infinite; animation-delay: -5s;  }
  .blade--b { animation: blade-fall 23s linear infinite; animation-delay: -16s; }

  /* wordmark centrato, sopra le lame */
  .mark {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    z-index: 2;
  }
  .mark img {
    display: block;
    width: 640px; height: auto;   /* 1921×215 → ~72px */
    transform-origin: 50% 50%;
    will-change: transform;
    animation: breathe 6.5s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate;
  }
  /* respiro: 6.5s andata + 6.5s ritorno (alternate) = ciclo 13s;
     la curva è l'approssimazione standard di sine.inOut */
  @keyframes breathe {
    from { transform: scale3d(1, 1, 1); }
    to   { transform: scale3d(1.02, 1.02, 1); }
  }

  .meta { z-index: 3; }

  @media (prefers-reduced-motion: reduce) {
    .blade, .mark img { animation: none; }
    .blade { opacity: 0; } /* senza moto sarebbero barre fisse: via */
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div class="blade blade--a"></div>
    <div class="blade blade--b"></div>
    <div class="mark">
      <img src="media/sottosopra-logo-white.png" alt="Sottosopra">
    </div>
  </div>
</div>

<script src="_shared.js"></script>
<script>
LW.ready(function () { /* solo fit dello stage: la scena è CSS puro */ });
</script>
</body>
</html>
