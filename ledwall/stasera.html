<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Sottosopra — Ledwall · Stasera</title>
<link rel="stylesheet" href="_shared.css">
<style>
  /* ── STASERA — manifesto della serata in corso ─────────────────────────
     UNA sola idea: i nomi di stasera, giganti, uno sotto l'altro, ognuno
     giustificato edge-to-edge. Niente orari, niente etichette, niente ledger
     (quello è palco.html): il muro dice CHI, non QUANDO.

     Il corpo di OGNI nome è calcolato a runtime perché la riga riempia la
     larghezza: i nomi corti (POPA, KRANO) arrivano al tetto d'altezza e le
     loro lettere si distribuiscono larghissime; i nomi lunghi (FROM DISCO TO
     DISCO) scendono di corpo e restano compatti. È il linguaggio dei poster
     del brand: ogni riga tocca i due bordi, l'aria sta nei gap.

     Gesto: masked line reveal a cascata → l'aria si apre nei gap → tenuta
     lunga che respira → uscita verso l'alto. Ciclo 22.0s esatti. */

  #inner {
    position: absolute; inset: 30px 34px 62px;
    display: flex; flex-direction: column;
  }

  #stasera { font-size: 92px; }

  #names {
    flex: 1 1 0; min-height: 0;      /* l'altezza è lo spazio rimasto, non il contenuto:
                                        è la misura su cui il fit decide i corpi */
    margin-top: 22px;
    display: flex; flex-direction: column;
  }
  .nm { flex: 0 0 auto; }            /* mai compressi: l'altezza è quella del corpo */

  /* La maschera del reveal deve lasciar passare i discendenti sotto la linea di
     base (l'ogonek di DEGHEĮO): il padding allarga la zona visibile, il margine
     negativo lo annulla nel layout → l'altezza di riga resta esattamente 1em. */
  #names .lnmask { padding-bottom: 0.08em; margin-bottom: -0.08em; }

  /* metro invisibile: misura la larghezza naturale di un nome a corpo 100 */
  #meas {
    position: absolute; left: -4000px; top: 0; visibility: hidden;
    display: inline-block; white-space: nowrap; text-transform: uppercase;
    font-size: 100px; line-height: 1; letter-spacing: normal;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">

    <div id="inner">
      <div id="head"><div class="just" id="stasera" data-text="Stasera"></div></div>
      <div id="names"></div>
    </div>
    <span id="meas" aria-hidden="true"></span>

  </div>
</div>

<script src="vendor/gsap.min.js"></script>
<script src="vendor/CustomEase.min.js"></script>
<script src="_shared.js"></script>
<script>
/* ── i nomi di stasera (programma DEFINITIVO 2026) ──
   SOLO musica e spettacolo, in ordine di scaletta: niente talk istituzionali,
   niente laboratori. Grafie di brand: Degheįo con la Į, Vendredi sur Mer senza
   accento (è il nome francese dell'artista). */
var DAYS = {
  gio: { label: 'Giovedì 30 luglio', names: ['ADRIAN FARTADE'] },
  ven: { label: 'Venerdì 31 luglio', names: ['DEGHEĮO', 'GENERIC ANIMAL', 'KRANO', 'CAVALLI MONGOLI'] },
  sab: { label: 'Sabato 1 agosto',   names: ['FROM DISCO TO DISCO', 'POPA', 'VENDREDI SUR MER', 'FACCIANUVOLA'] },
  dom: { label: 'Domenica 2 agosto', names: ['DR. PIRA', 'LIBRI BRUTTI', 'ELASI', 'JESSE THE FACCIO', 'AURORO BOREALO', 'EX-OTAGO'] }
};

/* giorno da ?day=gio|ven|sab|dom, altrimenti dalla data reale, fallback ven
   (stesso pattern di palco.html) */
function pickDay() {
  var q = new URLSearchParams(location.search).get('day');
  if (q && DAYS[q]) return q;
  var iso = new Date().toISOString().slice(5, 10);
  return { '07-30': 'gio', '07-31': 'ven', '08-01': 'sab', '08-02': 'dom' }[iso] || 'ven';
}

var CICLO  = 22;    /* durata del loop, secondi */
var HIDE   = 125;   /* yPercent di partenza: > 100 perché la maschera dei nomi
                       ha 0.08em di padding in fondo (i discendenti) */
var GAPV   = 14;    /* aria minima garantita fra un nome e l'altro */
var FS_MAX = 168;
var FS_MIN = 34;

LW.ready(function () {
  var day     = DAYS[pickDay()];
  var titleEl = document.getElementById('stasera');
  var namesEl = document.getElementById('names');
  var innerEl = document.getElementById('inner');
  var meas    = document.getElementById('meas');
  var sc      = LW.stageScale() || 1;


  /* ── 1 · il titolo, prima di tutto: la sua altezza definisce lo spazio che
        resta ai nomi ── */
  titleEl.setAttribute('aria-label', 'Stasera');
  var titleLines = LW.justify(titleEl);

  /* ── 2 · righe vuote: servono solo a leggere lo spazio davvero disponibile ── */
  var list = day.names, n = list.length;
  namesEl.innerHTML = list.map(function () { return '<div class="just nm"></div>'; }).join('');
  var els    = [].slice.call(namesEl.children);
  var availW = namesEl.clientWidth;                       /* px CSS (non scalati) */
  var availH = namesEl.clientHeight;
  var cap    = Math.floor((availH - GAPV * (n - 1)) / n); /* tetto d'altezza per nome */

  /* la riga giustificata va in overflow quando la somma dei pezzi supera la
     colonna (space-between produrrebbe gap negativi = parole sovrapposte),
     oppure quando il nome è andato a capo */
  function overflows(el) {
    var lines = el.querySelectorAll('.ln');
    if (lines.length !== 1) return true;
    var kids = lines[0].children, s = 0;
    for (var k = 0; k < kids.length; k++) s += kids[k].getBoundingClientRect().width;
    return s / sc > lines[0].clientWidth - 3;
  }

  /* ── 3 · un corpo per nome: riempi la larghezza, ma non sforare in altezza ── */
  var nameLines = [];
  els.forEach(function (el, i) {
    meas.textContent = list[i];
    var w100 = meas.offsetWidth || 1;                     /* larghezza naturale a corpo 100 */
    var fs   = Math.max(FS_MIN, Math.min(Math.floor(availW * 0.99 * 100 / w100), cap, FS_MAX));

    el.setAttribute('data-text', list[i]);
    el.setAttribute('aria-label', list[i]);
    el.style.fontSize = fs + 'px';
    LW.justify(el);

    var guard = 0;                                        /* rete: mai un nome tagliato o a capo */
    while (overflows(el) && fs > FS_MIN && guard++ < 60) {
      fs -= 2; el.style.fontSize = fs + 'px'; LW.justify(el);
    }
    nameLines = nameLines.concat([].slice.call(el.querySelectorAll('.ln')));
  });
  meas.textContent = '';

  /* ── 3b · TETTO ALL'ARIA ──────────────────────────────────────────────
     Con molti nomi il corpo scende, e un nome corto giustificato su tutta la
     larghezza si sfarina: la domenica «ELASI» diventava cinque lettere sparse
     a 180px l'una dall'altra, illeggibile come parola.
     Regola: si giustifica solo se l'inchiostro occupa già almeno il 62% della
     riga. Sotto quella soglia il nome resta compatto, a tracciatura naturale,
     allineato a sinistra — come una riga di poster che non arriva al margine. */
  nameLines.forEach(function (ln) {
    var kids = [].slice.call(ln.children);
    if (kids.length < 2) return;
    var sc = LW.stageScale() || 1;
    var ink = kids.reduce(function (s, k) { return s + k.getBoundingClientRect().width / sc; }, 0);
    var lineW = ln.getBoundingClientRect().width / sc;
    if (ink / lineW < 0.62) {
      ln.style.justifyContent = 'flex-start';
      /* spazio-parola naturale fra i pezzi: se sono lettere sta stretto,
         se sono parole resta il gap di una spaziatura piena */
      var isLetters = kids.every(function (k) { return k.textContent.length === 1; });
      ln.style.gap = (isLetters ? 0.04 : 0.3) + 'em';
    }
  });
  namesEl.style.justifyContent = n > 1 ? 'space-between' : 'center';

  /* ── 4 · delta «compatto → giustificato»: l'aria che si aprirà nei gap ── */
  titleLines.concat(nameLines).forEach(function (ln) {
    var d = LW.packDeltas(ln);
    [].slice.call(ln.children).forEach(function (wd, i) { wd._dx = d[i] || 0; });
  });
  var titleWds = [].slice.call(titleEl.querySelectorAll('.wd'));
  var nameWds  = [].slice.call(namesEl.querySelectorAll('.wd'));

  /* ── 5 · timeline ── */
  var tl = gsap.timeline({ repeat: -1 });

  /* stato iniziale DENTRO la timeline: ri-applicato a ogni giro
     (ultimo frame ≡ primo frame: nero + meta, tutto il resto fuori maschera) */
  tl.set(titleLines.concat(nameLines), { yPercent: HIDE }, 0);
  tl.set(titleWds.concat(nameWds), { x: function (i, t) { return t._dx || 0; } }, 0);
  tl.set(innerEl, { scale: 1 }, 0);

  /* 1 · masked line reveal: prima STASERA, poi i nomi a cascata */
  tl.to(titleLines, { yPercent: 0, duration: 0.9, ease: 'soso' }, 0);
  tl.to(nameLines,  { yPercent: 0, duration: 0.9, ease: 'soso', stagger: 0.1 }, 0.45);
  /* 2 · l'aria si apre: lettere e parole si distribuiscono edge-to-edge */
  tl.to(titleWds, { x: 0, duration: 1.2, ease: 'expo.inOut', stagger: 0.02 }, 1.05);
  tl.to(nameWds,  { x: 0, duration: 1.3, ease: 'expo.inOut', stagger: 0.01 }, 1.45);

  /* 3 · tenuta lunga: il muro non è mai fermo del tutto (4 mezze onde → torna
        esattamente al valore di partenza) */
  var apertura = tl.duration();
  var coda     = 0.55 + 0.06 * (nameLines.length - 1) + 0.2 + 0.6; /* uscita + nero */
  var tenuta   = Math.max(6, CICLO - apertura - coda);
  tl.to(innerEl, { scale: 1.008, duration: tenuta / 4, ease: 'sine.inOut', yoyo: true, repeat: 3 }, apertura);

  /* 4 · uscita verso l'alto, dentro le maschere */
  var tOut = apertura + tenuta;
  tl.to(nameLines,  { yPercent: -110, duration: 0.55, ease: 'power2.in', stagger: 0.06 }, tOut);
  tl.to(titleLines, { yPercent: -110, duration: 0.55, ease: 'power2.in' }, tOut + 0.06 * (nameLines.length - 1) + 0.2);
  tl.to({}, { duration: 0.6 }, tOut + coda - 0.6);   /* respiro nero → ciclo esatto */

  /* rende SUBITO il tempo 0 (sincrono): senza questo il primo frame mostrerebbe
     lo stato finale del CSS prima che il tick applichi i set */
  tl.pause(0);
  tl.play();

  /* Guardiano: dopo 3s la timeline dovrebbe essere a ~3s. Se il rAF è strozzato
     (pagina in un iframe di sfondo, come nel player) l'intro non parte mai e il
     muro resterebbe nero → si salta allo stato leggibile della tenuta.
     setTimeout continua a scattare anche quando requestAnimationFrame no. */
  setTimeout(function () { if (tl.time() < 2) tl.time(apertura + 1.2); }, 3000);

  window.TL = tl; /* per scrub/verifica deterministica */
});
</script>
</body>
</html>
