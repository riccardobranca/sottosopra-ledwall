<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Sottosopra — Ledwall · Non solo concerti (slot)</title>
<link rel="stylesheet" href="_shared.css">
<style>
  /* titolo giustificato in alto — due .just = a-capo garantito su 2 righe */
  .title {
    position: absolute; left: 34px; right: 34px; top: 48px;
    visibility: hidden;
  }
  .title .just { font-size: 136px; }

  /* box-slot BIANCO, angoli vivi, testo nero — la finestra del reel */
  #slot {
    position: absolute; left: 34px; top: 380px;
    height: 200px; overflow: hidden;
    background: var(--fg); color: var(--bg);
    /* width impostata via JS: larga quanto la parola più lunga + padding */
  }
  #reel { display: flex; flex-direction: column; }
  /* Le lettere sono DISTRIBUITE edge-to-edge dentro il box (stesso principio dei
     titoloni: riga mono-parola = lettere distribuite). Così ogni parola riempie
     esattamente la finestra — con l'allineamento a sinistra, «ARTE» lasciava
     mezzo box vuoto mentre «WORKSHOP» lo riempiva. */
  #reel .cell {
    height: 200px; padding: 0 44px;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 120px; line-height: 1; text-transform: uppercase;
    white-space: nowrap;
  }
  #reel .cell span { display: block; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">

    <div class="title">
      <div class="just" data-text="Non solo"></div>
      <div class="just" data-text="Concerti"></div>
    </div>

    <div id="slot">
      <div id="reel">
        <div class="cell">Musica</div>
        <div class="cell">Talk</div>
        <div class="cell">Workshop</div>
        <div class="cell">Arte</div>
        <div class="cell">Cibo</div>
        <div class="cell">Sport</div>
        <div class="cell">Libri</div>
        <!-- duplicato della prima: l'ultimo frame del ciclo ≡ il primo -->
        <div class="cell">Musica</div>
      </div>
    </div>
  </div>
</div>

<script src="vendor/gsap.min.js"></script>
<script src="vendor/CustomEase.min.js"></script>
<script src="_shared.js"></script>
<script>
LW.ready(function () {
  var title = document.querySelector('.title');
  var slot  = document.getElementById('slot');
  var reel  = document.getElementById('reel');
  var cells = [].slice.call(reel.children);

  /* titolo: righe giustificate modello poster (persistente, niente intro) */
  [].slice.call(title.querySelectorAll('.just')).forEach(function (j) { LW.justify(j); });
  title.style.visibility = 'visible';

  /* ① box largo quanto la parola più lunga + padding.
     La misura va fatta PRIMA di distribuire le lettere: dopo, il flex
     space-between allarga il testo fino al box e la misura sarebbe circolare.
     Elemento di prova fuori flusso = larghezza naturale del testo. */
  var padX = 44, maxW = 0, sc = LW.stageScale() || 1;
  var probe = document.createElement('span');
  probe.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;' +
    'font:inherit;font-size:120px;line-height:1;text-transform:uppercase;';
  slot.appendChild(probe);
  cells.forEach(function (c) {
    probe.textContent = c.textContent.trim();
    var w = probe.getBoundingClientRect().width / sc;
    if (w > maxW) maxW = w;
  });
  slot.removeChild(probe);
  slot.style.width = Math.ceil(maxW + padX * 2) + 'px';

  /* ② ora le lettere: span distribuiti edge-to-edge dal flex space-between */
  cells.forEach(function (c) {
    c.innerHTML = c.textContent.trim().split('').map(function (ch) {
      return '<span>' + ch + '</span>';
    }).join('');
  });

  /* ── timeline: 8 battute da 2.4s = 19.2s ──
     battute 1–7: tenuta 1.2s + scatto slot 1.2s (ease 'soso') alla parola dopo
     battuta 8:   MUSICA tiene l'intera battuta (respiro lungo sul giro di boa)
     Il reel ha 8 celle (MUSICA duplicata in coda): ultimo frame ≡ primo frame. */
  var STEP = 2.4, MOVE = 1.2, CELL = 100 / cells.length; /* 12.5 yPercent per cella */

  var tl = gsap.timeline({ repeat: -1 });
  tl.set(reel, { yPercent: 0 }, 0);

  for (var k = 0; k < cells.length - 1; k++) {
    tl.to(reel, {
      yPercent: -CELL * (k + 1),
      duration: MOVE,
      ease: 'soso'
    }, k * STEP + (STEP - MOVE));
  }

  /* il titolo respira per tutto il loop: 8 mezzi-cicli yoyo da 2.4s,
     numero pari → alla chiusura torna esattamente a scale 1 */
  tl.to(title, {
    scale: 1.01,
    duration: STEP,
    ease: 'sine.inOut',
    yoyo: true,
    repeat: 7
  }, 0);

  window.TL = tl; /* per scrub/verifica deterministica */
});
</script>
</body>
</html>
