<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Sottosopra — Oggi · 2</title>
<link rel="stylesheet" href="_shared.css">
<style>
  /* «LEDGER DI UNA SERATA» · opzione 2 — la stessa riga delle story sui
     biglietti, ma per la sola giornata di oggi. La dicitura «zona parterre»
     sta SOPRA la barra, così l'occhio la incontra prima del dato: la
     percentuale non resta mai senza referente. */

  .scene { position: absolute; left: 0; right: 0; padding: 0 72px;
           top: 250px; bottom: 480px; display: flex; flex-direction: column; justify-content: center; }

  .kick { overflow: hidden; margin-bottom: 34px; }
  .kick span { display: block; font-size: 36px; letter-spacing: 0.18em; text-transform: uppercase; }

  #giorno { font-size: 92px; margin-bottom: 52px; }

  .zona { display: flex; align-items: baseline; justify-content: space-between;
          border-top: 3px solid var(--fg); padding-top: 18px; margin-bottom: 18px; }
  .zona .k { font-size: 34px; letter-spacing: 0.14em; text-transform: uppercase; }
  .zona .p { font-size: 96px; line-height: 0.9; }
  .zona .p em { font-style: normal; font-size: 0.44em; }
  .zmask { overflow: hidden; }

  .bar { height: 46px; }
  .barlab { margin-top: 14px; font-size: 26px; letter-spacing: 0.14em;
            text-transform: uppercase; color: var(--muted); }

  .live { margin-top: 54px; display: flex; flex-direction: column; gap: 10px; }
  .live .nm { font-size: 46px; line-height: 1; text-transform: uppercase; display: block; }
  .nmask { overflow: hidden; }

  .foot { position: absolute; left: 72px; right: 72px; bottom: 300px;
          display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .foot img { display: block; width: 620px; }
  .fmask { overflow: hidden; }
</style>
</head>
<body class="reel">
<div id="wrap">
  <div id="stage">
    <div class="scene">
      <div class="kick"><span id="kick">Andamento biglietti</span></div>
      <div class="just" id="giorno" data-text=""></div>

      <div class="zona">
        <span class="zmask"><span class="k" id="zona"></span></span>
        <span class="zmask"><span class="p" id="pct"></span></span>
      </div>
      <div class="bar"><div class="fill"></div></div>
      <div class="barlab" id="barlab"></div>

      <div class="live" id="live"></div>
    </div>

    <div class="foot">
      <div class="fmask"><img src="media/sottosopra-logo-black.png" alt="Sottosopra"></div>
    </div>

    <div class="safe">
      <i style="top:0;height:250px"></i>
      <i style="bottom:0;height:200px"></i>
    </div>
  </div>
</div>

<script src="vendor/gsap.min.js"></script>
<script src="vendor/CustomEase.min.js"></script>
<script src="_oggi.js"></script>
<script src="_shared.js"></script>
<script>
SG.ready(function () {
  var O = window.OGGI;

  document.getElementById('zona').textContent = O.zona;
  document.getElementById('pct').innerHTML = O.pct + '<em>%</em>';
  document.getElementById('barlab').textContent = O.metrica;
  document.getElementById('live').innerHTML = O.live.map(function (n) {
    return '<div class="nmask"><div class="nm just" data-text="' + n + '"></div></div>';
  }).join('');

  var gEl = document.getElementById('giorno');
  gEl.setAttribute('data-text', O.giorno);
  gEl.textContent = O.giorno;
  var lines = SG.justify(gEl);
  var guard = 0;
  while (guard++ < 30) {
    var box = gEl.getBoundingClientRect(), over = false;
    [].slice.call(gEl.querySelectorAll('.ln')).forEach(function (ln) {
      var ink = [].slice.call(ln.children).reduce(function (a, k) {
        return a + k.getBoundingClientRect().width; }, 0);
      if (ink > box.width + 1) over = true;
    });
    if (!over) break;
    gEl.style.fontSize = (parseFloat(getComputedStyle(gEl).fontSize) * 0.94).toFixed(1) + 'px';
    gEl.removeAttribute('data-text');
    gEl.textContent = O.giorno;
    lines = SG.justify(gEl);
  }
  SG.capAir(lines);

  var nameEls = [].slice.call(document.querySelectorAll('.live .nm'));
  var nameLines = [];
  nameEls.forEach(function (el) { nameLines = nameLines.concat(SG.justify(el)); });
  SG.capAir(nameLines, 1);   /* i nomi restano compatti: distribuiti a lettere diventano illeggibili */

  var kick = document.getElementById('kick');
  var zk   = document.getElementById('zona');
  var pEl  = document.getElementById('pct');
  var fill = document.querySelector('.fill');
  var lab  = document.getElementById('barlab');
  var foot = [].slice.call(document.querySelectorAll('.foot .fmask > *'));

  var tl = gsap.timeline();
  tl.set(kick, { yPercent: 110 });
  tl.set(lines, { yPercent: 110 });
  tl.set([zk, pEl], { yPercent: 110 });
  tl.set(fill, { scaleX: 0 });
  tl.set(lab, { opacity: 0 });
  tl.set(nameLines, { yPercent: 110 });
  tl.set(foot, { yPercent: 110 });

  tl.to(kick, { yPercent: 0, duration: 0.5, ease: 'soso' }, 0);
  tl.to(lines, { yPercent: 0, duration: 0.7, ease: 'soso', stagger: 0.08 }, 0.15);
  /* prima la dicitura della zona, poi il numero: si legge nell'ordine giusto */
  tl.to(zk, { yPercent: 0, duration: 0.55, ease: 'soso' }, 0.7);
  tl.to(pEl, { yPercent: 0, duration: 0.6, ease: 'soso' }, 0.85);
  tl.to(fill, { scaleX: O.pct / 100, duration: 1.2, ease: 'power3.out' }, 1.0);
  tl.to(lab, { opacity: 1, duration: 0.4 }, 1.6);
  tl.to(nameLines, { yPercent: 0, duration: 0.6, ease: 'soso', stagger: 0.09 }, 1.7);
  tl.to(foot, { yPercent: 0, duration: 0.6, ease: 'soso' }, 2.1);

  window.TL = tl;
  setTimeout(function () { if (!SG.frozen && tl.time() < 1) tl.progress(1); }, 3000);
});
</script>
</body>
</html>
