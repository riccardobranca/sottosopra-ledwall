<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Sottosopra — Ledwall · Tra poco sul palco</title>
<link rel="stylesheet" href="_shared.css">
<style>
  /* «TRA POCO SUL PALCO» — la scena dei cambi-atto: chi arriva adesso e quanto
     manca. Legge l'ora vera e sceglie da sola il prossimo atto del programma.
     Per le prove: ?day=ven&now=21:10 (giorno e ora finti). */

  .scene { position: absolute; inset: 44px 34px 74px; display: flex; flex-direction: column; }

  .kick { overflow: hidden; }
  .kick .label { display: block; }

  /* il nome dell'atto: riempie la larghezza, corpo calcolato dal JS */
  .who { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .who .just { font-size: 120px; }

  /* riga bassa: orario in un box invertito + countdown */
  .foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 30px; }

  .hour {
    background: var(--fg); color: var(--bg);
    padding: 8px 26px 14px;
    font-size: 92px; line-height: 1; letter-spacing: 0.02em;
  }
  .hmask { overflow: hidden; }

  .left { text-align: right; }
  .left .n {
    font-size: 92px; line-height: 1; display: block;
  }
  .left .u { margin-top: 8px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div class="scene">
      <div class="kick"><span class="label" id="kick">Tra poco sul palco</span></div>
      <div class="who"><div class="just" id="who" data-text="—"></div></div>
      <div class="foot">
        <div class="hmask"><div class="hour" id="hour">—</div></div>
        <div class="left"><span class="n" id="left">—</span><span class="label u" id="unit">minuti</span></div>
      </div>
    </div>
  </div>
</div>

<script src="vendor/gsap.min.js"></script>
<script src="vendor/CustomEase.min.js"></script>
<script src="_shared.js"></script>
<script>
/* Programma reale 2026 — Area Palco + gli atti principali dell'Area Sud
   (fonte: src/content/programma.yaml). Orari d'inizio. */
var DAYS = {
  gio: { label: 'Giovedì 30 luglio', acts: [
    { t: '19:00', n: 'Aperitivo di beneficenza' },
    { t: '20:30', n: 'CNA Treviso' },
    { t: '21:30', n: 'Adrian Fartade' },
  ]},
  ven: { label: 'Venerdì 31 luglio', acts: [
    { t: '18:00', n: 'Spaghetti Disco' },
    { t: '19:00', n: 'Banca delle Terre Venete' },
    { t: '20:00', n: 'Paolo Bosca' },
    { t: '20:30', n: 'Degheįo' },
    { t: '21:30', n: 'Generic Animal' },
    { t: '22:30', n: 'Krano' },
    { t: '23:30', n: 'Cavalli Mongoli' },
  ]},
  sab: { label: 'Sabato 1 agosto', acts: [
    { t: '17:00', n: 'Laboratori' },
    { t: '18:30', n: 'From Disco To Disco' },
    { t: '19:00', n: 'Gianni Montieri' },
    { t: '21:00', n: 'Popa' },
    { t: '22:00', n: 'Vendredi sur Mer' },
    { t: '23:00', n: 'Faccianuvola' },
  ]},
  dom: { label: 'Domenica 2 agosto', acts: [
    { t: '10:00', n: 'La domenica sportiva' },
    { t: '12:30', n: 'Listening session' },
    { t: '17:00', n: 'Laboratori' },
    { t: '18:00', n: 'Dr. Pira' },
    { t: '19:00', n: 'Libri Brutti' },
    { t: '19:00', n: 'Elasi' },
    { t: '20:00', n: 'Jesse the Faccio' },
    { t: '21:00', n: 'Auroro Borealo' },
    { t: '22:30', n: 'Ex-Otago' },
  ]},
};

var Q = new URLSearchParams(location.search);

function pickDay() {
  var q = Q.get('day');
  if (q && DAYS[q]) return q;
  var d = new Date();
  var iso = String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  return { '07-30': 'gio', '07-31': 'ven', '08-01': 'sab', '08-02': 'dom' }[iso] || 'ven';
}

/* minuti dall'inizio del giorno; gli atti dopo mezzanotte non esistono in lista */
function nowMin() {
  var f = Q.get('now');
  if (f && /^\d{1,2}:\d{2}$/.test(f)) {
    var p = f.split(':'); return (+p[0]) * 60 + (+p[1]);
  }
  var d = new Date();
  return d.getHours() * 60 + d.getMinutes();
}
function toMin(t) { var p = t.split(':'); return (+p[0]) * 60 + (+p[1]); }

/* il prossimo atto: il primo che deve ancora iniziare. Se sono finiti tutti,
   torna l'ultimo con un messaggio diverso (non lasciare mai il muro vuoto). */
function nextAct(day) {
  var m = nowMin();
  for (var i = 0; i < day.acts.length; i++) {
    if (toMin(day.acts[i].t) > m) return { act: day.acts[i], left: toMin(day.acts[i].t) - m, over: false };
  }
  return { act: day.acts[day.acts.length - 1], left: 0, over: true };
}

LW.ready(function () {
  var day = DAYS[pickDay()];
  var st = nextAct(day);

  var whoEl = document.getElementById('who');
  var hourEl = document.getElementById('hour');
  var leftEl = document.getElementById('left');
  var unitEl = document.getElementById('unit');
  var kickEl = document.getElementById('kick');


  if (st.over) {
    /* dopo l'ultimo atto la scena cambia registro: niente countdown */
    kickEl.textContent = 'Stanotte sul palco';
    unitEl.textContent = 'grazie';
    leftEl.textContent = '·';
  } else if (st.left <= 1) {
    kickEl.textContent = 'Adesso sul palco';
    unitEl.textContent = 'ci siamo';
    leftEl.textContent = '·';
  } else if (st.left >= 60) {
    var h = Math.floor(st.left / 60);
    leftEl.textContent = h;
    unitEl.textContent = h === 1 ? 'ora' : 'ore';
  } else {
    leftEl.textContent = st.left;
    unitEl.textContent = st.left === 1 ? 'minuto' : 'minuti';
  }

  hourEl.textContent = st.act.t;
  whoEl.setAttribute('data-text', st.act.n);

  /* il nome riempie la larghezza: riduci il corpo finché sta in 2 righe al max */
  var lines = LW.justify(whoEl);
  var fs = 120, guard = 0;
  while (lines.length > 2 && fs > 54 && guard++ < 30) {
    fs -= 8;
    whoEl.style.fontSize = fs + 'px';
    whoEl.removeAttribute('data-text');
    whoEl.textContent = st.act.n;
    lines = LW.justify(whoEl);
  }

  var kickInner = kickEl;
  var hourMask = hourEl;

  var tl = gsap.timeline({ repeat: -1 });

  /* entrata: chi arriva prima, poi il nome, poi l'orario e il countdown */
  tl.set(kickInner, { yPercent: 110 });
  tl.set(lines, { yPercent: 110 });
  tl.set(hourMask, { yPercent: 110 });
  tl.set([leftEl, unitEl], { opacity: 0, y: 22 });

  tl.to(kickInner, { yPercent: 0, duration: 0.7, ease: 'soso' });
  tl.to(lines, { yPercent: 0, duration: 0.95, ease: 'soso', stagger: 0.1 }, '-=0.35');
  tl.to(hourMask, { yPercent: 0, duration: 0.8, ease: 'soso' }, '-=0.5');
  tl.to([leftEl, unitEl], { opacity: 1, y: 0, duration: 0.6, ease: 'power2.out', stagger: 0.07 }, '-=0.45');

  /* tenuta lunga: è un'informazione, va letta. Il numero pulsa piano
     (è il cuore della scena) — mai fermo del tutto. */
  tl.to(leftEl, { scale: 1.035, duration: 2.6, ease: 'sine.inOut', yoyo: true, repeat: 3, transformOrigin: '100% 50%' });

  /* uscita e rientro: la scena si "rinfresca" restando sempre uguale */
  tl.to([kickInner, hourMask], { yPercent: -110, duration: 0.5, ease: 'power2.in', stagger: 0.05 });
  tl.to(lines, { yPercent: -110, duration: 0.5, ease: 'power2.in', stagger: 0.05 }, '<');
  tl.to([leftEl, unitEl], { opacity: 0, duration: 0.35 }, '<');
  tl.to({}, { duration: 0.5 });

  window.TL = tl;

  /* il countdown è vero: ogni minuto la pagina si riallinea al programma */
  setInterval(function () { location.reload(); }, 60000);
});
</script>
</body>
</html>
