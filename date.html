<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Sottosopra — Ledwall · Le date</title>
<link rel="stylesheet" href="_shared.css">
<style>
  /* «LE DATE» — 30 31 01 02 edge-to-edge, un highlight bianco cicla sui numeri */
  .scene {
    position: absolute; inset: 56px 34px 96px;
    display: flex; flex-direction: column; justify-content: center;
    visibility: hidden;
  }

  /* scritta sopra la riga: parole distribuite edge-to-edge, dentro una maschera */
  .top { overflow: hidden; margin-bottom: 54px; }
  .topline {
    display: flex; justify-content: space-between; align-items: baseline;
    line-height: 1.25;
  }
  .topline span:last-child { margin-right: -0.18em; } /* compensa il letter-spacing finale */

  /* riga dei quattro numeri.
     NON space-between su colonne di larghezza diversa: il glifo «1» ha molto
     side-bearing, così i gap risultavano otticamente disuguali (verificato a
     schermo). Griglia a 4 colonne pari con ancore ai bordi: i CENTRI sono
     equidistanti, il primo e l'ultimo numero restano a filo margine. */
  .row { display: grid; grid-template-columns: repeat(4, 1fr); align-items: flex-start; }
  .col { position: relative; justify-self: center; }
  .col:first-child { justify-self: start; }
  .col:last-child  { justify-self: end; }

  .numwrap { position: relative; font-size: 260px; } /* corpo definitivo fissato dal JS (fit edge-to-edge) */
  /* Highlight a larghezza COSTANTE (misurate: 30→1.296em, 31→1.074, 01→1.083,
     02→1.283 — il glifo «1» è più stretto). Legandolo al numero, il rettangolo
     cambiava forma a ogni scatto: qui è sempre lo stesso blocco che si sposta. */
  .box {
    position: absolute; left: 50%; width: 1.44em; margin-left: -0.72em;
    top: -0.01em; bottom: 0.08em;
    background: var(--fg);
    transform: scaleY(0); transform-origin: 50% 100%;
  }
  .nmask { position: relative; z-index: 1; display: block; overflow: hidden; }
  .num { display: block; line-height: 1; color: var(--fg); }

  /* label del giorno: rullo mascherato sotto ogni numero (il 30 ha la seconda voce) */
  .dmask {
    position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
    margin-top: 30px; width: 300px; height: 20px; overflow: hidden;
  }
  .dmask .label {
    position: absolute; left: 0; right: 0; top: 0;
    text-align: center; line-height: 20px; white-space: nowrap;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div class="scene">
      <div class="top">
        <div class="label topline"><span>LUGLIO</span><span>—</span><span>AGOSTO</span><span>2026</span></div>
      </div>
      <div class="row">
        <div class="col">
          <div class="numwrap"><div class="box"></div><span class="nmask"><span class="num">30</span></span></div>
          <div class="dmask"><span class="label day">GIO</span><span class="label alt">INGRESSO LIBERO</span></div>
        </div>
        <div class="col">
          <div class="numwrap"><div class="box"></div><span class="nmask"><span class="num">31</span></span></div>
          <div class="dmask"><span class="label day">VEN</span></div>
        </div>
        <div class="col">
          <div class="numwrap"><div class="box"></div><span class="nmask"><span class="num">01</span></span></div>
          <div class="dmask"><span class="label day">SAB</span></div>
        </div>
        <div class="col">
          <div class="numwrap"><div class="box"></div><span class="nmask"><span class="num">02</span></span></div>
          <div class="dmask"><span class="label day">DOM</span></div>
        </div>
      </div>
    </div>
    <div class="meta"><span>Giardini del Castello</span><span>Castelfranco Veneto</span></div>
  </div>
</div>

<script src="vendor/gsap.min.js"></script>
<script src="vendor/CustomEase.min.js"></script>
<script src="_shared.js"></script>
<script>
LW.ready(function () {
  var cols  = [].slice.call(document.querySelectorAll('.col'));
  var wraps = cols.map(function (c) { return c.querySelector('.numwrap'); });
  var boxes = cols.map(function (c) { return c.querySelector('.box'); });
  var nums  = cols.map(function (c) { return c.querySelector('.num'); });
  var days  = cols.map(function (c) { return c.querySelector('.day'); });
  var alt   = document.querySelector('.alt');       /* INGRESSO LIBERO (solo col 30) */
  var ttl   = document.querySelector('.topline');
  var row   = document.querySelector('.row');

  /* fit: le cifre riempiono ~86% della riga, il resto è aria nei 3 gap (space-between
     porta i numeri esterni a filo dei margini). Rapporto scala-invariante. */
  var rw  = row.getBoundingClientRect().width;
  var sum = wraps.reduce(function (a, w) { return a + w.getBoundingClientRect().width; }, 0);
  var fs  = Math.max(140, Math.min(280, 260 * (0.86 * rw / sum)));
  wraps.forEach(function (w) { w.style.fontSize = fs.toFixed(1) + 'px'; });

  var TR = 0.6, HOLD = 2.4, STEP = TR + HOLD, T0 = 1.2; /* griglia 0.6s · ciclo 4×3s = 12s */
  var tl = gsap.timeline({ repeat: -1 });

  /* stato iniziale — ri-applicato a ogni ripetizione del loop */
  tl.set('.scene', { visibility: 'visible' });
  tl.set(nums,  { yPercent: 110, color: '#fff' });
  tl.set(boxes, { scaleY: 0 });
  tl.set(wraps, { scale: 1 });
  tl.set(days,  { yPercent: 110 });
  tl.set(alt,   { yPercent: 110 });
  tl.set(ttl,   { yPercent: 110 });

  /* 1 · entrata: masked reveal dei numeri, stagger dai bordi verso il centro */
  tl.to(nums, { yPercent: 0, duration: 0.9,  ease: 'soso', stagger: { each: 0.12, from: 'edges' } }, 0);
  tl.to(ttl,  { yPercent: 0, duration: 0.75, ease: 'soso' }, 0.15);
  tl.to(days, { yPercent: 0, duration: 0.72, ease: 'soso', stagger: { each: 0.09, from: 'edges' } }, 0.3);

  /* 2 · ciclo highlight: il box bianco entra dal basso ('soso'), il numero si inverte;
        il precedente si spegne nello stesso battito da 0.6s */
  for (var k = 0; k < 4; k++) {
    var t = T0 + k * STEP;
    tl.to(boxes[k], { scaleY: 1,      duration: TR, ease: 'soso' }, t);
    tl.to(nums[k],  { color: '#000',  duration: TR, ease: 'power2.inOut' }, t);
    if (k > 0) {
      tl.to(boxes[k - 1], { scaleY: 0,     duration: TR, ease: 'power2.in' }, t);
      tl.to(nums[k - 1],  { color: '#fff', duration: TR, ease: 'power2.inOut' }, t);
    }
    /* tenuta 2.4s: il numero attivo respira, mai fermo del tutto */
    tl.to(wraps[k], { scale: 1.015, duration: HOLD / 2, ease: 'sine.inOut', yoyo: true, repeat: 1 }, t + TR);
  }

  /* 3 · giovedì è gratis: sotto il 30 attivo GIO → INGRESSO LIBERO (rullo su), poi ritorno */
  tl.to(days[0], { yPercent: -110, duration: TR, ease: 'power2.in' }, T0);
  tl.to(alt,     { yPercent: 0,    duration: TR, ease: 'soso' },      T0);
  tl.to(alt,     { yPercent: 110,  duration: TR, ease: 'power2.in' }, T0 + STEP);
  tl.to(days[0], { yPercent: 0,    duration: TR, ease: 'soso' },      T0 + STEP);

  /* 4 · chiusura: l'ultimo box si spegne (13.2), poi tutto esce dalla maschera verso l'alto */
  tl.to(boxes[3], { scaleY: 0,     duration: TR, ease: 'power2.in' },     13.2);
  tl.to(nums[3],  { color: '#fff', duration: TR, ease: 'power2.inOut' },  13.2);
  tl.to(nums, { yPercent: -110, duration: 0.6, ease: 'power2.in', stagger: { each: 0.07, from: 'edges' } }, 13.8);
  tl.to(days, { yPercent: -110, duration: 0.6, ease: 'power2.in' }, 13.85);
  tl.to(ttl,  { yPercent: -110, duration: 0.6, ease: 'power2.in' }, 13.8);
  tl.to({}, { duration: 0.6 }, 14.4); /* respiro nero: chiude il ciclo a 15.0s esatti */

  window.TL = tl; /* per scrub/verifica deterministica */
});
</script>
</body>
</html>
