<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Sottosopra — Ledwall · Istituzioni manifesto</title>
<link rel="stylesheet" href="_shared.css">
<style>
  /* «ISTITUZIONI MANIFESTO» — il ringraziamento detto con la voce del brand.
     La dicitura ufficiale NON è una didascalia sotto un logo: È il titolone,
     giustificato edge-to-edge come i poster. Il logo istituzionale sta in basso
     a sinistra, piccolo e composto, sotto un regolo che chiude la composizione.
     Registro sobrio: un solo gesto (le righe salgono, l'aria si apre nei gap),
     tenute lunghe perché una dicitura istituzionale va letta con calma.

     Impianto (differente dalla variante centrata di `istituzioni.html`):
       riga-testata 22px  →  titolone allineato in alto  →  regolo + logo in basso
     Le due schermate condividono la stessa griglia, così la seconda sembra la
     continuazione della prima e non una slide nuova. */

  .screen {
    position: absolute;
    left: 34px; right: 34px; top: 40px; bottom: 74px;   /* 966 × 575, meta libera sotto */
    display: flex; flex-direction: column;
    visibility: hidden;
  }

  /* testata riservata su ENTRAMBE le schermate: il titolone parte sempre alla
     stessa quota, anche quando la label non c'è */
  .head { flex: none; height: 22px; }
  .headmask { overflow: hidden; }

  .body { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
  .body .just { line-height: 1.05; }   /* solo fallback: le .ln hanno line-height 1 */

  /* la larghezza della parola non deve cambiare tra la passata di misura di
     LW.justify e la resa finale (TREVISO-BELLUNO non si spezza sul trattino) */
  .just .w { white-space: nowrap; }

  .foot { flex: none; }
  .foot .rule { height: 3px; transform: scaleX(0); transform-origin: 0 50%; }
  .logomask { overflow: hidden; margin-top: 22px; }
  .logomask img {
    display: block;
    filter: invert(1);          /* i loghi sono grigi su bianco: qui bianchi su nero */
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">

    <!-- A · COMUNE — dicitura esatta: «Con il Patrocinio di» -->
    <div class="screen" data-size="110" data-min="100" data-lines="2" data-hold="3.2">
      <div class="head"></div>
      <div class="body">
        <div class="just" data-text="Con il Patrocinio di">Con il Patrocinio di</div>
      </div>
      <div class="foot">
        <div class="rule"></div>
        <div class="logomask">
          <img src="logos/citta-castelfranco.png" alt="Città di Castelfranco Veneto" style="height:90px">
        </div>
      </div>
    </div>

    <!-- B · CAMERA DI COMMERCIO — dicitura esatta:
         «Progetto realizzato in collaborazione e con il contributo della
          Camera di commercio di Treviso-Belluno»
         resa su due livelli (label + titolone) senza cambiarne una parola
         né l'ordine. -->
    <div class="screen" data-size="62" data-min="46" data-lines="5" data-hold="5.4">
      <div class="head"><div class="headmask"><div class="label">Progetto realizzato</div></div></div>
      <div class="body">
        <div class="just" data-text="in collaborazione e con il contributo della Camera di commercio di Treviso-Belluno">in collaborazione e con il contributo della Camera di commercio di Treviso-Belluno</div>
      </div>
      <div class="foot">
        <div class="rule"></div>
        <div class="logomask">
          <img src="logos/camera-commercio.png" alt="Camera di commercio di Treviso-Belluno" style="height:56px">
        </div>
      </div>
    </div>

    <div class="meta"><span>Sottosopra 2026</span><span>Giardini del Castello</span></div>
  </div>
</div>

<script src="vendor/gsap.min.js"></script>
<script src="vendor/CustomEase.min.js"></script>
<script src="_shared.js"></script>
<script>
LW.ready(function () {
  var screens = [].slice.call(document.querySelectorAll('.screen'));

  /* ── impaginazione: corpo di partenza, poi si scende finché il blocco
        sta nelle righe previste E nell'altezza disponibile. Le misure sono
        offsetHeight/clientHeight = px di layout, immuni allo scale di anteprima. */
  screens.forEach(function (sc) {
    var just = sc.querySelector('.just');
    var body = sc.querySelector('.body');
    var maxLines = parseInt(sc.dataset.lines, 10);
    var min = parseFloat(sc.dataset.min);
    var size = parseFloat(sc.dataset.size);

    sc.style.visibility = 'visible';          /* serve una composizione misurabile */
    var maxH = body.clientHeight;             /* fisso: .body è flex:1 1 0 con min-height:0 */
    var lines = [];
    for (var g = 0; g < 24; g++) {
      just.style.fontSize = size + 'px';
      lines = LW.justify(just);
      if (lines.length <= maxLines && just.offsetHeight <= maxH) break;
      if (size <= min) break;
      size -= 2;
    }

    /* delta "compatto → giustificato": l'aria che si aprirà nei gap */
    lines.forEach(function (line) {
      var d = LW.packDeltas(line);
      [].slice.call(line.children).forEach(function (wd, i) { wd._dx = d[i] || 0; });
    });

    sc._lines = lines;
    sc._words = [].slice.call(just.querySelectorAll('.wd'));
    sc.style.visibility = '';                 /* torna al hidden del foglio di stile */
  });

  var tl = gsap.timeline({ repeat: -1 });

  screens.forEach(function (sc) {
    var lines = sc._lines, words = sc._words;
    var title = sc.querySelector('.just');
    var label = sc.querySelector('.label');   /* solo la schermata B ce l'ha */
    var rule  = sc.querySelector('.rule');
    var img   = sc.querySelector('.logomask img');
    var hold  = parseFloat(sc.dataset.hold);

    /* stato iniziale — ripetuto a ogni giro: è ciò che chiude il loop */
    tl.set(sc, { visibility: 'visible' });
    tl.set(lines, { yPercent: 110 });
    tl.set(words, { x: function (i, t) { return t._dx || 0; } });
    tl.set(title, { scale: 1 });
    tl.set(rule,  { scaleX: 0 });
    tl.set(img,   { yPercent: 115 });
    if (label) tl.set(label, { yPercent: 110 });

    /* 1 · si legge prima chi parla (label), poi la dicitura */
    if (label) tl.to(label, { yPercent: 0, duration: 0.7, ease: 'soso' });
    /* 2 · masked line reveal: le righe salgono da sotto la maschera */
    tl.to(lines, { yPercent: 0, duration: 0.9, ease: 'soso', stagger: 0.09 }, label ? '-=0.35' : '+=0');
    /* 3 · l'aria si apre: le parole raggiungono i due bordi */
    tl.to(words, { x: 0, duration: 1.25, ease: 'expo.inOut', stagger: 0.012 }, '-=0.6');
    /* 4 · il regolo si tira da sinistra e il logo sale nella sua maschera */
    tl.to(rule, { scaleX: 1, duration: 1.2, ease: 'soso' }, '-=0.75');
    tl.to(img,  { yPercent: 0, duration: 0.95, ease: 'soso' }, '-=0.95');
    /* 5 · tenuta lunga: il blocco respira, non è mai del tutto fermo */
    tl.to(title, { scale: 1.005, duration: hold, ease: 'sine.inOut', yoyo: true, repeat: 1 });
    /* 6 · uscita verso l'alto, composta */
    tl.to(lines, { yPercent: -110, duration: 0.55, ease: 'power3.in', stagger: 0.06 });
    tl.to(img,   { yPercent: -115, duration: 0.55, ease: 'power3.in' }, '-=0.45');
    tl.to(rule,  { scaleX: 0, duration: 0.5, ease: 'power2.in' }, '-=0.5');
    if (label) tl.to(label, { yPercent: -110, duration: 0.5, ease: 'power3.in' }, '-=0.5');
    tl.set(sc, { visibility: 'hidden' });
    tl.to({}, { duration: 0.7 });             /* nero pieno tra le due schermate */
  });

  window.TL = tl;                             /* verifica a scrub */
});

/* guardiano: se il rAF viene strozzato (o i font non risolvono) e la timeline
   non nasce, la scena resterebbe invisibile → dopo 3s si mostra almeno la
   prima schermata nel suo stato finale. No-op quando tutto funziona. */
setTimeout(function () {
  if (window.TL) return;
  var sc = document.querySelector('.screen');
  if (!sc) return;
  sc.style.visibility = 'visible';
  var r = sc.querySelector('.rule');          if (r) r.style.transform = 'scaleX(1)';
  var i = sc.querySelector('.logomask img');  if (i) i.style.transform = 'none';
}, 3000);
</script>
</body>
</html>
