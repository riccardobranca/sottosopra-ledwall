<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Sottosopra — Ledwall · Titoloni manifesto</title>
<link rel="stylesheet" href="_shared.css">
<style>
  .phrase {
    position: absolute; inset: 40px 34px 70px;
    display: flex; flex-direction: column; justify-content: center;
    visibility: hidden;
  }
  .phrase .just + .just { margin-top: 0; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div class="phrase" data-hold="3.6">
      <div class="just" style="font-size:96px"  data-text="Non è solo un festival."></div>
      <div class="just" style="font-size:96px"  data-text="È anche un modo di stare"></div>
    </div>
    <div class="phrase" data-hold="4.2">
      <div class="just" style="font-size:150px" data-text="Cambia il punto di vista"></div>
    </div>
    <div class="phrase" data-hold="4.2">
      <div class="just" style="font-size:112px" data-text="Inizia a guardare il mondo sottosopra"></div>
    </div>
    <div class="phrase" data-hold="4.2">
      <div class="just" style="font-size:148px" data-text="Sempre Sottosopra"></div>
    </div>
    <div class="meta"><span>Sottosopra</span><span>Giardini del Castello</span></div>
  </div>
</div>

<script src="vendor/gsap.min.js"></script>
<script src="vendor/CustomEase.min.js"></script>
<script src="_shared.js"></script>
<script>
LW.ready(function () {
  var phrases = [].slice.call(document.querySelectorAll('.phrase'));

  /* costruisci le righe giustificate e annota i delta "compatto → giustificato" */
  phrases.forEach(function (ph) {
    ph.style.visibility = 'visible'; /* per misurare */
    [].slice.call(ph.querySelectorAll('.just')).forEach(function (j) {
      LW.justify(j).forEach(function (line) {
        var deltas = LW.packDeltas(line);
        [].slice.call(line.children).forEach(function (wd, i) { wd._dx = deltas[i]; });
      });
    });
    ph.style.visibility = 'hidden';
  });

  var tl = gsap.timeline({ repeat: -1 });

  phrases.forEach(function (ph) {
    var lines = [].slice.call(ph.querySelectorAll('.ln'));
    var words = [].slice.call(ph.querySelectorAll('.wd'));
    var hold = parseFloat(ph.dataset.hold || '4');

    tl.set(ph, { visibility: 'visible' });
    /* stato iniziale: righe sotto la maschera, parole compatte */
    tl.set(lines, { yPercent: 110 });
    tl.set(words, { x: function (i, t) { return t._dx || 0; } });

    /* 1 · le righe salgono da sotto la maschera */
    tl.to(lines, { yPercent: 0, duration: 0.85, ease: 'soso', stagger: 0.11 });
    /* 2 · l'aria si apre: le parole si distribuiscono edge-to-edge */
    tl.to(words, { x: 0, duration: 1.15, ease: 'expo.inOut', stagger: 0.012 }, '-=0.55');
    /* 3 · tenuta: il blocco respira, mai fermo del tutto */
    tl.to(ph, { scale: 1.01, duration: hold / 2, ease: 'sine.inOut', yoyo: true, repeat: 1 });
    /* 4 · uscita verso l'alto */
    tl.to(lines, { yPercent: -110, duration: 0.5, ease: 'power2.in', stagger: 0.06 });
    tl.set(ph, { visibility: 'hidden' });
    tl.to({}, { duration: 0.35 }); /* respiro nero tra le frasi */
  });

  window.TL = tl; /* per scrub/verifica deterministica */
});
</script>
</body>
</html>
