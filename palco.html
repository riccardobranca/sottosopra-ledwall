<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Sottosopra — Ledwall · Stasera sul palco</title>
<link rel="stylesheet" href="_shared.css">
<style>
  #inner { position: absolute; inset: 34px 34px 62px; display: flex; flex-direction: column; }

  #head { overflow: hidden; }
  #daytitle { font-size: 72px; }

  #rows { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; margin-top: 18px; }

  .row {
    display: flex; align-items: baseline; gap: 28px;
    padding: 10px 12px; margin: 0 -12px;
    border-top: 2px solid var(--line);
  }
  .row:first-child { border-top: 0; }
  .row .time { font-size: 26px; color: var(--muted); letter-spacing: 0.06em; width: 96px; flex-shrink: 0; }
  .row .name { font-size: 46px; text-transform: uppercase; line-height: 1; white-space: nowrap; }
  .row .sub  { font-size: 18px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; }
  .row .kind { margin-left: auto; font-size: 15px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); flex-shrink: 0; }
  .rowmask { overflow: hidden; }

  /* headliner: riga invertita fissa */
  .row.hl { background: #fff; color: #000; }
  .row.hl .time, .row.hl .sub, .row.hl .kind { color: rgba(0,0,0,0.55); }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div id="inner">
      <div id="head"><div class="just" id="daytitle"></div></div>
      <div id="rows"></div>
    </div>
    <div class="meta"><span id="metaL">Sul palco stasera</span><span id="metaR"></span></div>
  </div>
</div>

<script src="vendor/gsap.min.js"></script>
<script src="vendor/CustomEase.min.js"></script>
<script src="_shared.js"></script>
<script>
/* dati dal programma DEFINITIVO 2026 (programma.yaml) — Area Palco */
var DAYS = {
  gio: { label: 'Giovedì 30 luglio', gates: '18:00', rows: [
    { t: '20:30', n: 'Credito e piccole imprese', s: 'CNA Treviso', k: 'Talk' },
    { t: '21:30', n: 'Andrà tutto male ma sarà bellissimo', s: 'Adrian Fartade', k: 'Talk', h: true },
  ]},
  ven: { label: 'Venerdì 31 luglio', gates: '18:00', rows: [
    { t: '19:00', n: 'Sottosopra Impresa', s: 'Banca delle Terre Venete', k: 'Talk' },
    { t: '20:30', n: 'Degheįo', k: 'Live' },
    { t: '21:30', n: 'Generic Animal', k: 'Live', h: true },
    { t: '22:30', n: 'Krano', k: 'Live' },
    { t: '23:30', n: 'Cavalli Mongoli', k: 'Live' },
  ]},
  sab: { label: 'Sabato 1 agosto', gates: '16:00', rows: [
    { t: '18:30', n: 'From Disco To Disco', s: 'Mario · Munstac B2B Gaz', k: 'DJ Set' },
    { t: '21:00', n: 'Popa', k: 'Live' },
    { t: '22:00', n: 'Vendredi sur Mer', k: 'Live', h: true },
    { t: '23:00', n: 'Faccianuvola', k: 'Live' },
  ]},
  dom: { label: 'Domenica 2 agosto', gates: '10:00', rows: [
    { t: '18:00', n: 'Hip-hop e alieni: siamo in pericolo?', s: 'Dr. Pira e Treviso Comic Book', k: 'Show' },
    { t: '19:00', n: 'Libri Brutti', s: 'Auroro Borealo', k: 'Show' },
    { t: '20:00', n: 'Jesse the Faccio', k: 'Live' },
    { t: '21:00', n: 'Auroro Borealo', k: 'Live' },
    { t: '22:30', n: 'Ex-Otago', k: 'Live', h: true },
  ]},
};

/* giorno da ?day=gio|ven|sab|dom, altrimenti dalla data reale, fallback ven */
function pickDay() {
  var q = new URLSearchParams(location.search).get('day');
  if (q && DAYS[q]) return q;
  var iso = new Date().toISOString().slice(5, 10);
  return { '07-30': 'gio', '07-31': 'ven', '08-01': 'sab', '08-02': 'dom' }[iso] || 'ven';
}

LW.ready(function () {
  var day = DAYS[pickDay()];
  var esc = function (s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); };

  document.getElementById('daytitle').setAttribute('data-text', day.label);
  document.getElementById('metaR').textContent = 'Cancelli ore ' + day.gates;

  var rowsEl = document.getElementById('rows');
  rowsEl.innerHTML = day.rows.map(function (r) {
    return '<div class="rowmask"><div class="row' + (r.h ? ' hl' : '') + '">' +
      '<span class="time">' + r.t + '</span>' +
      '<span class="name">' + esc(r.n) + '</span>' +
      (r.s ? '<span class="sub">' + esc(r.s) + '</span>' : '') +
      '<span class="kind">' + r.k + '</span>' +
    '</div></div>';
  }).join('');

  /* titoli troppo larghi → riduci il corpo finché entra (niente ellissi sul ledwall) */
  [].slice.call(rowsEl.querySelectorAll('.row')).forEach(function (row) {
    var name = row.querySelector('.name');
    var fs = 46, sc = LW.stageScale();
    while (row.scrollWidth * 1 > row.clientWidth && fs > 22) {
      fs -= 2; name.style.fontSize = fs + 'px';
    }
  });

  var titleLines = LW.justify(document.getElementById('daytitle'));
  var rows = [].slice.call(rowsEl.querySelectorAll('.row'));
  var normal = rows.filter(function (r) { return !r.classList.contains('hl'); });

  var tl = gsap.timeline({ repeat: -1 });

  /* intro */
  tl.set(titleLines, { yPercent: 110 });
  tl.set(rows, { yPercent: 110 });
  tl.to(titleLines, { yPercent: 0, duration: 0.9, ease: 'soso' });
  tl.to(rows, { yPercent: 0, duration: 0.75, ease: 'power3.out', stagger: 0.09 }, '-=0.45');

  /* sweep: l'evidenza scorre riga per riga (la headliner resta invertita fissa) */
  tl.to({}, { duration: 1.2 });
  for (var pass = 0; pass < 2; pass++) {
    normal.forEach(function (row) {
      var parts = row.querySelectorAll('.time,.sub,.kind');
      tl.to(row, { backgroundColor: '#ffffff', color: '#000000', duration: 0.18, ease: 'power1.in' });
      tl.to(parts, { color: 'rgba(0,0,0,0.55)', duration: 0.18 }, '<');
      tl.to(row, { backgroundColor: 'rgba(255,255,255,0)', color: '#ffffff', duration: 0.3, ease: 'power1.out' }, '+=0.85');
      tl.to(parts, { color: '#8a8a8a', duration: 0.3 }, '<');
    });
    tl.to({}, { duration: 1.6 });
  }

  /* uscita */
  tl.to(rows, { yPercent: -110, duration: 0.5, ease: 'power2.in', stagger: 0.05 });
  tl.to(titleLines, { yPercent: -110, duration: 0.5, ease: 'power2.in' }, '-=0.3');
  tl.to({}, { duration: 0.6 });

  window.TL = tl; /* per scrub/verifica deterministica */
});
</script>
</body>
</html>
