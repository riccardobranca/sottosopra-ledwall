<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Sottosopra — Ledwall · Taggaci</title>
<link rel="stylesheet" href="_shared.css">
<style>
  /* ── TAGGACI ──────────────────────────────────────────────────────────────
     Una sola idea: la handle È il manifesto. @SOTTOSOPRAFESTIVAL occupa tutta
     la larghezza del muro come una riga mono-parola dei poster (lettere
     distribuite edge-to-edge). Entra a onda dal centro, poi ogni 8s le lettere
     fanno un'onda verticale: il testo saluta. Niente altro si muove.
     Hook in alto a sinistra, hashtag in basso a destra: la diagonale incornicia
     la parola senza centrarla (asimmetria svizzera). */

  .scene { position: absolute; inset: 0; visibility: hidden; }

  /* micro-label dentro maschera: reveal e uscita per traslazione */
  .lbmask { position: absolute; overflow: hidden; }
  .lbmask .label { display: block; line-height: 1.4; white-space: nowrap; }

  .hook { left: 34px; top: 140px; }
  .tag  { right: 34px; top: 496px; }
  /* il letter-spacing lascia un vuoto dopo l'ultima lettera: lo recupero, così
     l'hashtag arriva davvero a filo del margine destro (come la handle sotto) */
  .tag .label { margin-right: -0.18em; }

  /* banda verticale in cui la handle è centrata: il corpo lo decide il JS,
     quindi NON posso fissare un top in px — la banda sì (e lo scale del respiro
     ruota intorno al suo centro, che è il centro della parola) */
  .handle {
    position: absolute; left: 34px; right: 34px; top: 196px; height: 280px;
    display: flex; flex-direction: column; justify-content: center;
  }

  /* La maschera delle righe (overflow hidden) taglia esattamente alla riga di
     testo. La «@» però scende a −0.204em sotto la linea di base (misurato nel
     font) mentre con line-height:1 sotto la base restano solo 0.136em: senza
     questo padding la coda della chiocciola verrebbe tranciata. In alto il
     margine serve invece all'onda (−8% = 0.08em). */
  .handle .lnmask { padding: 0.08em 0 0.14em; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">

    <div class="scene">
      <div class="hook lbmask"><span class="label">Sei qui? Raccontalo</span></div>

      <div class="handle">
        <div class="just" data-text="@SOTTOSOPRAFESTIVAL"></div>
      </div>

      <div class="tag lbmask"><span class="label">#Sottosopra2026</span></div>
    </div>

    <div class="meta"><span>Instagram</span><span>@sottosoprafestival</span></div>
  </div>
</div>

<script src="vendor/gsap.min.js"></script>
<script src="vendor/CustomEase.min.js"></script>
<script src="_shared.js"></script>
<script>
LW.ready(function () {
  var stage  = document.getElementById('stage');
  var scene  = document.querySelector('.scene');
  var handle = document.querySelector('.handle');
  var just   = handle.querySelector('.just');
  var hook   = document.querySelector('.hook .label');
  var tag    = document.querySelector('.tag .label');

  /* ① CORPO DELLA HANDLE — fit edge-to-edge.
     È una parola sola: LW.justify le distribuisce le lettere con flex
     space-between, quindi il corpo va scelto in modo che la larghezza NATURALE
     della parola stia dentro il riquadro lasciando l'aria da spartire nei gap.
     Misuro a 100px di riferimento e scendo finché entra: obiettivo 92% del
     riquadro → 8% diviso in 18 gap ≈ 0.06em di aria per gap, la tracciatura
     delle righe mono-parola dei poster. */
  var sc   = LW.stageScale() || 1;
  var boxW = handle.getBoundingClientRect().width / sc;   /* 1034 − 34×2 = 966 */
  var MAXW = boxW * 0.92;

  scene.style.visibility = 'visible';                     /* misure a schermo */

  var probe = document.createElement('span');
  probe.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden;' +
    'white-space:nowrap;text-transform:uppercase;line-height:1;font-size:100px;';
  probe.textContent = just.getAttribute('data-text');
  stage.appendChild(probe);                               /* eredita SoSo26 + ss07/ss08 */

  var nat100 = probe.getBoundingClientRect().width / sc;
  var fs = nat100 > 0 ? 100 * MAXW / nat100 : 70;
  fs = Math.max(44, Math.min(120, fs));
  probe.style.fontSize = fs + 'px';
  while (fs > 44 && probe.getBoundingClientRect().width / sc > MAXW) {
    fs -= 0.5;
    probe.style.fontSize = fs + 'px';
  }
  stage.removeChild(probe);

  just.style.fontSize = fs.toFixed(1) + 'px';
  LW.justify(just);                                       /* → .lnmask > .ln > .wd (una per lettera) */
  var letters = [].slice.call(just.querySelectorAll('.wd'));

  scene.style.visibility = '';                            /* torna hidden: apre la timeline */

  /* ② TIMELINE — ciclo di 24.0s esatti, tutto su transform.
        0.0  hook
        0.6  la handle sale dalla maschera, a onda dal centro
        1.8  hashtag
        6.0  onda ①  ·  14.0 onda ②   (saluto, 8s di passo)
       21.6  uscita verso l'alto, poi 1.0s di nero
     Ultimo frame ≡ primo: a 24.0 la scena è vuota come agli 0.0. */
  var tl = gsap.timeline({ repeat: -1 });

  tl.set(scene,       { visibility: 'visible' }, 0);
  tl.set(letters,     { yPercent: 130 }, 0);   /* 1.3em: sotto la maschera padding incluso */
  tl.set([hook, tag], { yPercent: 110 }, 0);
  tl.set(handle,      { scale: 1 }, 0);

  /* entrata */
  tl.to(hook,    { yPercent: 0, duration: 0.7, ease: 'soso' }, 0);
  tl.to(letters, { yPercent: 0, duration: 0.9, ease: 'soso',
                   stagger: { amount: 0.9, from: 'center' } }, 0.6);
  tl.to(tag,     { yPercent: 0, duration: 0.7, ease: 'soso' }, 1.8);

  /* respiro: mai ferma del tutto. 8 mezzi cicli da 3s = 24.0s → chiude a scale 1 */
  tl.to(handle, { scale: 1.006, duration: 3, ease: 'sine.inOut', yoyo: true, repeat: 7 }, 0);

  /* onda: ogni lettera sale di 8% e torna; lo sfasamento (1.1s da sinistra a
     destra) trasforma 19 movimenti identici in un'unica onda che attraversa la
     parola. yoyo → il valore torna esatto a 0, il loop resta pulito. */
  [6.0, 14.0].forEach(function (t) {
    tl.to(letters, { yPercent: -8, duration: 0.55, ease: 'sine.inOut',
                     yoyo: true, repeat: 1,
                     stagger: { amount: 1.1, from: 'start' } }, t);
  });

  /* uscita: tutto verso l'alto dentro le maschere */
  tl.to(tag,     { yPercent: -110, duration: 0.6, ease: 'power2.in' }, 21.6);
  tl.to(letters, { yPercent: -130, duration: 0.6, ease: 'power2.in',
                   stagger: { amount: 0.6, from: 'center' } }, 21.8);
  tl.to(hook,    { yPercent: -110, duration: 0.6, ease: 'power2.in' }, 22.0);
  tl.to({}, { duration: 0.4 }, 23.6);          /* nero finale → ciclo 24.0s netti */

  window.TL = tl;                              /* per scrub/verifica deterministica */
});
</script>
</body>
</html>
