<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Sottosopra — Ledwall · I numeri</title>
<link rel="stylesheet" href="_shared.css">
<style>
  /* «I NUMERI» — quattro schede-statistica in sequenza, una alla volta.
     Idea organizzante unica: UN numero gigantesco che ARRIVA CONTANDO,
     un regolo che si tira da sinistra, una didascalia giustificata sotto.
     L'ultima scheda (1) si inverte: inchiostro nero su slab bianco. */

  /* slab dell'inversione finale.
     NON è full-screen: resta una cornice nera (26px sui lati/alto, 60px sotto,
     dove vive la meta) → l'inversione è un colpo, non un muro di luce sul palco. */
  .panel {
    position: absolute; left: 26px; right: 26px; top: 26px; bottom: 60px;
    background: var(--fg);
    transform: scaleY(0); transform-origin: 50% 100%;
  }

  /* le quattro schede sono impilate nello stesso riquadro: ne vive una per volta */
  .card {
    position: absolute; inset: 56px 34px 96px;
    display: flex; flex-direction: column; justify-content: center;
    visibility: hidden;
  }

  /* il numero: allineato al margine sinistro (mai centrato), il vuoto a destra è aria.
     line-height 1 dentro una maschera = stessa resa verificata su date.html. */
  /* flex:none su maschera e regolo: se la colonna crescesse, uno shrink della
     maschera (overflow hidden) taglierebbe il numero. Mai. */
  .nmask { display: block; overflow: hidden; transform-origin: 0% 100%; flex: none;
           height: 320px; }   /* un tick: il rullo scorre dentro */
  .num   { display: block; line-height: 1; font-size: 320px; }
  .num .tick { display: block; height: 320px; line-height: 320px; }

  /* regolo: 3px (mai 1px sul LED), si tira da sinistra come una riga di ledger */
  .hr { height: 3px; background: var(--fg); transform: scaleX(0); transform-origin: 0% 50%; flex: none; }

  .cap { margin-top: 44px; flex: none; }

  /* scheda invertita */
  .card.inv .num,
  .card.inv .cap { color: #000; }
  .card.inv .hr  { background: #000; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div class="panel"></div>

    <div class="card" data-n="8">
      <span class="nmask"><span class="num">8</span></span>
      <div class="hr"></div>
      <div class="just cap" style="font-size:54px" data-text="EDIZIONI DAL 2017"></div>
    </div>

    <div class="card" data-n="80">
      <span class="nmask"><span class="num">80</span></span>
      <div class="hr"></div>
      <div class="just cap" style="font-size:54px" data-text="VOLONTARIƏ CHE LO FANNO"></div>
    </div>

    <div class="card" data-n="4">
      <span class="nmask"><span class="num">4</span></span>
      <div class="hr"></div>
      <div class="just cap" style="font-size:54px" data-text="GIORNATE DI FESTIVAL"></div>
    </div>

    <div class="card inv" data-n="1">
      <span class="nmask"><span class="num">1</span></span>
      <div class="hr"></div>
      <div class="just cap" style="font-size:54px" data-text="MODO DI STARE INSIEME"></div>
    </div>
  </div>
</div>

<script src="vendor/gsap.min.js"></script>
<script src="vendor/CustomEase.min.js"></script>
<script src="_shared.js"></script>
<script>
LW.ready(function () {
  var panel = document.querySelector('.panel');
  var cards = [].slice.call(document.querySelectorAll('.card'));

  /* ── costruzione: didascalie giustificate edge-to-edge, sempre su UNA riga ──
     (se una didascalia dovesse andare a capo, il corpo scende dell'8% e si ricostruisce) */
  cards.forEach(function (c) {
    c.style.visibility = 'visible';           /* serve layout reale per misurare */
    var cap = c.querySelector('.cap');
    var fs = 54;
    var lines = LW.justify(cap);
    var guard = 0;
    while (lines.length > 1 && fs > 32 && guard++ < 8) {
      fs *= 0.92;
      cap.style.fontSize = fs.toFixed(1) + 'px';
      lines = LW.justify(cap);
    }
    c._lines = lines;
    c._num  = c.querySelector('.num');
    c._mask = c.querySelector('.nmask');
    c._hr   = c.querySelector('.hr');
    c._val  = parseInt(c.getAttribute('data-n'), 10) || 1;
    c.style.visibility = 'hidden';
  });

  /* ── timeline: 3 schede da 7.2s + l'ultima (invertita) da 6.0s = 27.6s ──
     griglia ritmica 0.6s (100 BPM) */
  /* Il conteggio NON passa da una callback: è un RULLO di valori che scorre in
     puro transform. I tween con onUpdate su oggetti JS non venivano renderizzati
     quando si salta oltre la fine del conteggio, e il numero restava congelato a
     metà corsa. Un transform, invece, GSAP lo applica sempre.
     Il rullo mostra 7 tappe fino al valore finale: percettivamente è lo stesso
     scatto del contatore, ma è deterministico e scrubbabile. */
  cards.forEach(function (c) {
    var val = c._val, steps = [];
    var N = 7;
    for (var k = 1; k <= N; k++) {
      /* tappe distribuite con la stessa curva del vecchio conteggio (out) */
      var p = k / N, eased = 1 - Math.pow(1 - p, 3);
      steps.push(Math.max(1, Math.round(val * eased)));
    }
    steps[steps.length - 1] = val;                       /* l'ultima è il valore vero */
    c._steps = steps;
    c._num.innerHTML = steps.map(function (v) {
      return '<span class="tick">' + v + '</span>';
    }).join('');
  });

  var tl = gsap.timeline({ repeat: -1 });
  var t = 0;

  cards.forEach(function (c) {
    var inv  = c.classList.contains('inv');
    var d0   = inv ? 0.6 : 0;      /* sull'ultima il numero aspetta che salga lo slab */
    var EXIT = inv ? 4.8 : 6.0;    /* istante di uscita, locale alla scheda */
    var CARD = inv ? 6.0 : 7.2;    /* durata totale scheda, nero di stacco incluso */
    var BR   = (EXIT - (d0 + 1.8)) / 2;  /* mezza respirazione */

    var num = c._num;

    /* stato iniziale della scheda — ri-applicato a ogni giro del loop */
    tl.set(c,       { visibility: 'visible' }, t);
    tl.set(num,     { yPercent: 0 }, t);
    /* la maschera parte in posizione: è il RULLO a fare l'entrata (il numero
       nasce contando). L'uscita invece la fa la maschera, salendo. */
    tl.set(c._mask, { yPercent: 0, scale: 1 }, t);
    tl.set(c._hr,   { scaleX: 0, transformOrigin: '0% 50%' }, t);
    tl.set(c._lines,{ yPercent: 110 }, t);

    /* 0 · solo l'ultima: lo slab bianco sale e inverte il quadro */
    if (inv) {
      tl.set(panel, { scaleY: 0, transformOrigin: '50% 100%' }, t);
      tl.to(panel,  { scaleY: 1, duration: 0.6, ease: 'soso' }, t);
    }

    /* 1 · il rullo scatta fino al valore: È l'entrata del numero (nasce contando).
       .nmask è alta un tick e clippa; .num contiene gli N tick impilati. */
    var N = c._steps.length;
    tl.fromTo(num,
      { yPercent: 0 },
      { yPercent: -100 * (N - 1) / N, duration: 1.1, ease: 'power3.out', immediateRender: false },
      t + d0);

    /* 2 · il regolo si tira da sinistra e chiude il numero */
    tl.to(c._hr, { scaleX: 1, duration: 0.7, ease: 'soso' }, t + d0 + 0.6);

    /* 3 · didascalia: masked line reveal */
    tl.to(c._lines, { yPercent: 0, duration: 0.85, ease: 'soso' }, t + d0 + 0.9);

    /* 4 · tenuta: il numero respira ancorato al regolo (mai fermo del tutto) */
    tl.to(c._mask, { scale: 1.015, duration: BR, ease: 'sine.inOut', yoyo: true, repeat: 1 },
      t + d0 + 1.8);

    /* 5 · uscita verso l'alto; il regolo si ritira nel verso in cui era arrivato */
    tl.to(c._lines, { yPercent: -110, duration: 0.55, ease: 'power2.in' }, t + EXIT);
    tl.to(c._mask,  { yPercent: -110, duration: 0.60, ease: 'power2.in' }, t + EXIT);
    tl.set(c._hr,   { transformOrigin: '100% 50%' }, t + EXIT);
    tl.to(c._hr,    { scaleX: 0, duration: 0.5, ease: 'power2.in' }, t + EXIT + 0.05);
    tl.set(c,       { visibility: 'hidden' }, t + EXIT + 0.6);

    /* 6 · lo slab si ritira verso l'alto: il nero rientra e chiude il ciclo */
    if (inv) {
      tl.set(panel, { transformOrigin: '50% 0%' }, t + EXIT + 0.29);
      tl.to(panel,  { scaleY: 0, duration: 0.6, ease: 'power3.in' }, t + EXIT + 0.3);
    }

    t += CARD;
  });

  /* coda nera: porta il ciclo a 27.6s esatti (ultimo frame ≡ primo) */
  tl.to({}, { duration: 0.3 }, 27.3);

  window.TL = tl; /* per scrub/verifica deterministica */
});
</script>
</body>
</html>
