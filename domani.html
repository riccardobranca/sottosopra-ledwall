<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Sottosopra — Ledwall · Domani sera</title>
<link rel="stylesheet" href="_shared.css">
<style>
  /* «DOMANI SERA» — la scena che invoglia a tornare: chi c'è la sera dopo
     quella in corso, e dove si prende il biglietto. La domenica cambia
     registro (è l'ultima serata). Prove: ?day=gio|ven|sab|dom. */

  .scene {
    position: absolute; inset: 40px 34px 74px;
    display: flex; flex-direction: column;
    visibility: hidden;
  }

  /* etichetta in alto a sinistra, dentro una maschera per il reveal */
  .kick { overflow: hidden; }
  .kick .label { display: block; }

  /* zona centrale: il nome gigante + la riga degli altri nomi */
  .who { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .who .just { font-size: 120px; }

  .others {
    margin-top: 30px;
    font-size: 30px; line-height: 1.1; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--muted);
    white-space: nowrap; overflow: hidden;
  }

  /* riga bassa: data di domani in un box bianco + dove si comprano i biglietti */
  .foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 30px; }

  .datebox { position: relative; padding: 12px 28px 18px; flex-shrink: 0; }
  /* il fondo bianco cresce dal basso: il testo è NERO, quindi si legge solo
     dove il box è già arrivato → il reveal è il box stesso */
  .datebox .bg {
    position: absolute; inset: 0; background: var(--fg);
    transform-origin: 50% 100%;
  }
  .datebox .dt {
    position: relative; z-index: 1; display: block;
    font-size: 54px; line-height: 1; letter-spacing: 0.02em;
    text-transform: uppercase; color: #000; white-space: nowrap;
  }

  #cta { padding-bottom: 18px; text-align: right; white-space: nowrap; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div class="scene">
      <div class="kick"><span class="label" id="kick">Domani sera</span></div>

      <div class="who">
        <div class="just" id="title">—</div>
        <div class="others" id="others"></div>
      </div>

      <div class="foot">
        <div class="datebox" id="datebox"><span class="bg" id="datebg"></span><span class="dt" id="date"></span></div>
        <span class="label" id="cta">Biglietti su sottosopra.com</span>
      </div>
    </div>
    <div class="meta"><span>Sottosopra 2026</span><span>Giardini del Castello</span></div>
  </div>
</div>

<script src="vendor/gsap.min.js"></script>
<script src="vendor/CustomEase.min.js"></script>
<script src="_shared.js"></script>
<script>
/* Cosa succede DOMANI, per ogni serata in corso (fonte: programma.yaml 2026).
   `others` = gli altri atti della serata in ordine di scaletta. */
var TOMORROW = {
  gio: {
    kick: 'Domani sera', date: 'Ven 31 Lug', head: 'Generic Animal',
    others: ['Spaghetti Disco', 'Degheįo', 'Krano', 'Cavalli Mongoli']
  },
  ven: {
    kick: 'Domani sera', date: 'Sab 01 Ago', head: 'Vendredi sur Mer',
    others: ['From Disco To Disco', 'Popa', 'Faccianuvola']
  },
  sab: {
    kick: 'Domani sera', date: 'Dom 02 Ago', head: 'Ex-Otago',
    others: ['Libri Brutti', 'Elasi', 'Jesse the Faccio', 'Auroro Borealo']
  },
  /* domenica è l'ultima serata: niente domani, niente biglietto */
  dom: {
    last: true, kick: 'Ultima serata', head: "Ci vediamo l'anno prossimo",
    cta: 'Sottosopra torna nel 2027'
  }
};

/* giorno da ?day=gio|ven|sab|dom, altrimenti dalla data reale, fallback ven */
function pickDay() {
  var q = new URLSearchParams(location.search).get('day');
  if (q && TOMORROW[q]) return q;
  var d = new Date();
  var md = String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  return { '07-30': 'gio', '07-31': 'ven', '08-01': 'sab', '08-02': 'dom' }[md] || 'ven';
}

var D = TOMORROW[pickDay()];

/* contenuto scritto SUBITO (non dentro LW.ready): se i font non si risolvessero,
   il muro mostra comunque la scena grazie al guardiano qui sotto. */
var titleEl  = document.getElementById('title');
var othersEl = document.getElementById('others');
var dateEl   = document.getElementById('date');
var boxEl    = document.getElementById('datebox');
var bgEl     = document.getElementById('datebg');
var ctaEl    = document.getElementById('cta');
var kickEl   = document.getElementById('kick');

var OTHERS = (D.others || []).slice();

kickEl.textContent = D.kick;
titleEl.textContent = D.head;
titleEl.setAttribute('data-text', D.head);

if (D.last) {
  /* ultima serata: via il box data, la riga bassa resta sola a sinistra */
  boxEl.parentNode.removeChild(boxEl);
  boxEl = bgEl = null;
  othersEl.parentNode.removeChild(othersEl);
  othersEl = null;
  ctaEl.textContent = D.cta;
  ctaEl.style.textAlign = 'left';
  ctaEl.style.paddingBottom = '0';
} else {
  dateEl.textContent = D.date;
  othersEl.textContent = OTHERS.join(' · ');
}

/* guardiano: se GSAP non parte (o i font non si caricano mai) dopo 3s la scena
   viene comunque mostrata nel suo stato finale, invece di lasciare il muro nero. */
setTimeout(function () {
  if (window.TL) return; /* la timeline esiste: nessun intervento */
  var sc = document.querySelector('.scene');
  if (sc) sc.style.visibility = 'visible';
  if (bgEl) bgEl.style.transform = 'scaleY(1)';
}, 3000);

LW.ready(function () {
  var sc = LW.stageScale() || 1;

  /* ── fit del titolone ──────────────────────────────────────────────────────
     misuro la larghezza naturale su UNA riga a 120px: se ci sta (o quasi) resta
     a corpo pieno; se serve poco, scendo quel tanto che basta per non spezzare
     il nome; se è troppo lungo, resto a 120 e vado su due righe. Evita le righe
     mono-parola corte (una «MER» distribuita su 966px è un buco, non un poster). */
  var probe = document.createElement('span');
  probe.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden;' +
                        'white-space:nowrap;text-transform:uppercase;font-size:120px;';
  probe.textContent = D.head;
  titleEl.parentNode.appendChild(probe);
  var natural = probe.getBoundingClientRect().width / sc;
  probe.parentNode.removeChild(probe);

  var avail = titleEl.clientWidth || 966;
  var oneLine = natural > 0 ? 120 * avail / natural : 120;
  var fs = (oneLine >= 118) ? 120 : (oneLine >= 82 ? Math.floor(oneLine) - 1 : 120);
  titleEl.style.fontSize = fs + 'px';

  function rejustify() {
    titleEl.removeAttribute('data-text');
    titleEl.textContent = D.head;
    return LW.justify(titleEl);
  }
  var lines = rejustify();
  /* rete di sicurezza: mai più di due righe */
  var guard = 0;
  while (lines.length > 2 && fs > 56 && guard++ < 20) {
    fs -= 8;
    titleEl.style.fontSize = fs + 'px';
    lines = rejustify();
  }

  /* delta «compatto → giustificato»: l'aria che si apre */
  lines.forEach(function (line) {
    var deltas = LW.packDeltas(line);
    [].slice.call(line.children).forEach(function (wd, i) { wd._dx = deltas[i] || 0; });
  });
  var words = [].slice.call(titleEl.querySelectorAll('.wd'));

  /* ── fit della riga degli altri nomi ──
     prima riduco il corpo; se anche al minimo sfora, tolgo l'ultimo nome e
     riparto. Sul ledwall non esistono ellissi né testo tagliato. */
  if (othersEl) {
    var items = OTHERS.slice();
    while (items.length) {
      othersEl.textContent = items.join(' · ');
      var ofs = 30;
      othersEl.style.fontSize = ofs + 'px';
      while (othersEl.scrollWidth > othersEl.clientWidth && ofs > 23) {
        ofs -= 1; othersEl.style.fontSize = ofs + 'px';
      }
      if (othersEl.scrollWidth <= othersEl.clientWidth) break;
      items.pop();
    }
  }

  var who = document.querySelector('.who');
  var tl = gsap.timeline({ repeat: -1 });

  /* stato iniziale — ri-applicato a ogni giro del loop */
  tl.set('.scene', { visibility: 'visible' }, 0);
  tl.set(kickEl, { yPercent: 110 }, 0);
  tl.set(lines, { yPercent: 110 }, 0);
  tl.set(words, { x: function (i, t) { return t._dx || 0; } }, 0);
  tl.set(who, { scale: 1 }, 0);
  tl.set(ctaEl, { opacity: 0, y: 18 }, 0);
  if (othersEl) tl.set(othersEl, { opacity: 0, y: 24 }, 0);
  if (bgEl) tl.set(bgEl, { scaleY: 0 }, 0);

  /* 1 · entrata: etichetta, nome (masked reveal), aria che si apre */
  tl.to(kickEl, { yPercent: 0, duration: 0.75, ease: 'soso' }, 0.15);
  tl.to(lines, { yPercent: 0, duration: 0.95, ease: 'soso', stagger: 0.11 }, 0.5);
  tl.to(words, { x: 0, duration: 1.2, ease: 'expo.inOut', stagger: 0.012 }, 1.1);
  if (othersEl) tl.to(othersEl, { opacity: 1, y: 0, duration: 0.7, ease: 'power2.out' }, 1.9);
  /* 2 · il box bianco della data cresce dal basso e scopre la data */
  if (bgEl) tl.to(bgEl, { scaleY: 1, duration: 0.85, ease: 'soso' }, 2.15);
  tl.to(ctaEl, { opacity: 1, y: 0, duration: 0.6, ease: 'power2.out' }, 2.5);

  /* 3 · tenuta lunga: va letta da 20 metri. Il blocco respira, mai fermo del tutto.
        4 mezze oscillazioni da 3.25s = 13s, torna esattamente a scale 1. */
  tl.to(who, { scale: 1.012, duration: 3.25, ease: 'sine.inOut', yoyo: true, repeat: 3,
               transformOrigin: '50% 50%' }, 3.2);

  /* 4 · uscita */
  tl.to(lines, { yPercent: -110, duration: 0.55, ease: 'power2.in', stagger: 0.06 }, 16.4);
  if (othersEl) tl.to(othersEl, { opacity: 0, y: -18, duration: 0.45, ease: 'power2.in' }, 16.4);
  if (bgEl) tl.to(bgEl, { scaleY: 0, duration: 0.5, ease: 'power3.in' }, 16.55);
  tl.to(ctaEl, { opacity: 0, duration: 0.4, ease: 'power2.in' }, 16.55);
  tl.to(kickEl, { yPercent: -110, duration: 0.5, ease: 'power2.in' }, 16.7);
  tl.set('.scene', { visibility: 'hidden' }, 17.4);
  tl.to({}, { duration: 1.4 }, 18.6); /* respiro nero → ciclo di 20.0s esatti */

  window.TL = tl; /* per scrub/verifica deterministica */
});
</script>
</body>
</html>
