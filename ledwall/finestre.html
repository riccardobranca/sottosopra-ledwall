<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Sottosopra — Ledwall · Dentro le lettere</title>
<link rel="stylesheet" href="_shared.css">
<style>
  /* «DENTRO LE LETTERE» — SOTTO / SOPRA giganti, la folla vive dentro i glifi.
     Due layer con lo STESSO identico layout, impilati:
       .base  → lettere piene #2e2e2e = pavimento di leggibilità (le lettere non
                spariscono mai nel nero, anche dove la foto è scura)
       .photo → stessa composizione con testo trasparente + foto clippata nei
                glifi (background-clip:text) in mix-blend-mode:screen sopra la
                base → risultato = max(foto, #2e2e2e): sempre leggibile.
     Fuori dai glifi non si dipinge nulla: lo stage resta nero puro. */

  .win { position: absolute; inset: 44px 34px 96px; }

  .layer {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: space-between;
  }

  .row {
    display: flex; justify-content: space-between;
    font-size: 262px; line-height: 0.8;
    text-transform: uppercase;
  }
  .row span { display: block; }

  /* pavimento di leggibilità: la foto notturna è scurissima, senza questo le
     lettere sparirebbero nel nero del LED. Alzato dopo la verifica a schermo. */
  .base { color: #6a6a6a; }

  .photo {
    color: transparent;
    -webkit-text-fill-color: transparent;
    background-image: url('media/crowd-night-wide.jpg');
    background-repeat: no-repeat;
    background-size: 146%;               /* cover abbondante (cover ≈ 103%) → aria per la panna */
    background-position: 22% 68%;        /* banda bassa della foto: folla e luci, non cielo */
    -webkit-background-clip: text;
    background-clip: text;
    mix-blend-mode: screen;
    /* filtro STATICO (mai animato, regola 4): B/N garantito + contrasto da LED */
    filter: grayscale(1) brightness(2.3) contrast(1.35);
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div class="win" aria-label="Sotto Sopra">
      <div class="layer base">
        <div class="row"><span>S</span><span>O</span><span>T</span><span>T</span><span>O</span></div>
        <div class="row"><span>S</span><span>O</span><span>P</span><span>R</span><span>A</span></div>
      </div>
      <div class="layer photo" aria-hidden="true">
        <div class="row"><span>S</span><span>O</span><span>T</span><span>T</span><span>O</span></div>
        <div class="row"><span>S</span><span>O</span><span>P</span><span>R</span><span>A</span></div>
      </div>
    </div>
  </div>
</div>

<script src="vendor/gsap.min.js"></script>
<script src="vendor/CustomEase.min.js"></script>
<script src="_shared.js"></script>
<script>
LW.ready(function () {

  /* 1 · fit di sicurezza sul corpo: col font reale caricato, misuro la riga più
       larga e riporto il font-size perché le lettere riempiano il palco senza
       mai sforare (stesso corpo per TUTTE le righe di ENTRAMBI i layer: i due
       layer devono restare perfettamente sovrapposti). */
  var rows = [].slice.call(document.querySelectorAll('.row'));
  var sc = LW.stageScale() || 1;
  var winW = document.querySelector('.win').getBoundingClientRect().width / sc;
  var worst = 0;
  rows.forEach(function (r) {
    var sum = 0;
    [].slice.call(r.children).forEach(function (k) { sum += k.getBoundingClientRect().width; });
    worst = Math.max(worst, sum / sc);
  });
  if (worst > 0) {
    var fs = Math.round(262 * (winW * 0.94) / worst);  /* 6% minimo d'aria nei gap */
    fs = Math.max(180, Math.min(300, fs));             /* 300 ≈ tetto verticale (2×0.8×300 < 549) */
    rows.forEach(function (r) { r.style.fontSize = fs + 'px'; });
  }

  /* 2 · la foto vive dentro le lettere. Due moti sovrapposti su cicli CO-PRIMI:
       panna 18s (9s a metà, sine.inOut yoyo) + micro-zoom 13s (6.5s a metà).
       Il composito si ricompone identico solo al minimo comune multiplo, 234s,
       dove il master riparte: 9×26 = 6.5×36 = 234 → entrambi i tween chiudono
       un numero PARI di mezzi-cicli = tornano ESATTAMENTE ai valori iniziali
       (ultimo frame ≡ primo, velocità zero agli estremi del sine). */
  var ph = document.querySelector('.photo');
  var tl = gsap.timeline({ repeat: -1 });

  tl.fromTo(ph, { backgroundPosition: '22% 68%' },
    { backgroundPosition: '78% 42%', duration: 9, ease: 'sine.inOut', yoyo: true, repeat: 25 }, 0);

  tl.fromTo(ph, { backgroundSize: '146%' },
    { backgroundSize: '158%', duration: 6.5, ease: 'sine.inOut', yoyo: true, repeat: 35 }, 0);

  window.TL = tl; /* per scrub/verifica deterministica */
});
</script>
</body>
</html>
