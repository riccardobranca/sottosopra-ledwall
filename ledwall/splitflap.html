<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Sottosopra — Ledwall · Tabellone</title>
<link rel="stylesheet" href="_shared.css">
<style>
  /* «TABELLONE» — split-flap: ogni carattere è una cella che scorre attraverso
     l'alfabeto prima di fermarsi, come i tabelloni Solari delle stazioni.
     Riferimento UVA/Massive Attack: l'estetica dell'information board, che è poi
     la parentela più nobile del nostro linguaggio tipografico su LED. */

  .board {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px;
  }

  .line { display: flex; gap: 9px; }

  /* la cella: finestra fissa, dentro scorre il rullo dei caratteri */
  .cell {
    width: 68px; height: 116px;
    background: #101010;              /* non nero pieno: la cella si deve leggere come oggetto */
    overflow: hidden; position: relative;
  }
  .reel { position: absolute; left: 0; right: 0; top: 0; }
  .reel span {
    display: flex; align-items: center; justify-content: center;
    height: 116px; font-size: 76px; line-height: 1;
    color: var(--fg);
  }
  /* la fessura centrale del tabellone: 2px, mai 1 (shimmer) */
  .cell::after {
    content: ''; position: absolute; left: 0; right: 0; top: 50%;
    height: 2px; margin-top: -1px; background: #000; z-index: 2;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div class="board">
      <div class="line" id="l1"></div>
      <div class="line" id="l2"></div>
    </div>
  </div>
</div>

<script src="vendor/gsap.min.js"></script>
<script src="vendor/CustomEase.min.js"></script>
<script src="_shared.js"></script>
<script>
LW.ready(function () {
  var COLS = 12;
  var ALPHA = ' ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';

  /* le frasi del tabellone: coppie di righe, max 12 caratteri l'una */
  var MSGS = [
    ['SEMPRE', 'SOTTOSOPRA'],
    ['GIARDINI DEL', 'CASTELLO'],
    ['IL PUNTO DI', 'VISTA'],
    ['TRA POCO', 'SI RIPARTE'],
  ];

  function pad(s) {
    s = s.toUpperCase();
    var left = Math.floor((COLS - s.length) / 2);   /* centrato nel tabellone */
    return (' '.repeat(Math.max(0, left)) + s).padEnd(COLS, ' ').slice(0, COLS);
  }

  /* costruisce le 24 celle */
  var cells = [];
  [document.getElementById('l1'), document.getElementById('l2')].forEach(function (lineEl, r) {
    for (var c = 0; c < COLS; c++) {
      var cell = document.createElement('div');
      cell.className = 'cell';
      var reel = document.createElement('div');
      reel.className = 'reel';
      cell.appendChild(reel);
      lineEl.appendChild(cell);
      cells.push({ el: cell, reel: reel, row: r, col: c, ch: ' ' });
    }
  });

  var H = 116;
  var PADDED = MSGS.map(function (m) { return [pad(m[0]), pad(m[1])]; });

  /* Un rullo UNICO precostruito per cella, con tutti i caratteri attraversati
     nell'intero ciclo (4 frasi) e l'indice di sosta di ognuna. Così ogni gesto è
     un tween dentro la timeline: deterministico e scrubbabile.
     (Prima costruivo i rulli a runtime dentro tl.call con tween esterne: le
     animazioni sfuggivano alla timeline e le celle restavano a metà corsa.) */
  cells.forEach(function (cell) {
    var chars = [' '], stops = [];
    var cur = 0;                                  /* indice in ALPHA */
    PADDED.forEach(function (target) {
      var to = target[cell.row][cell.col];
      var i1 = ALPHA.indexOf(to); if (i1 < 0) i1 = 0;
      var steps = (i1 - cur + ALPHA.length) % ALPHA.length;
      if (steps === 0) steps = ALPHA.length;      /* stesso carattere = giro intero */
      for (var k = 1; k <= steps; k++) chars.push(ALPHA[(cur + k) % ALPHA.length]);
      cur = i1;
      stops.push(chars.length - 1);               /* dove si ferma per questa frase */
    });
    cell.reel.innerHTML = chars.map(function (c) { return '<span>' + c + '</span>'; }).join('');
    cell.stops = stops;
  });

  var tl = gsap.timeline({ repeat: -1 });
  var STEP = 7.2;   /* una frase ogni 7.2s (griglia ritmica 0.6) */

  cells.forEach(function (cell) {
    gsap.set(cell.reel, { y: 0 });
    /* onda da sinistra, riga dopo riga: il tabellone non scatta tutto insieme */
    var delay = cell.col * 0.055 + cell.row * 0.12;
    cell.stops.forEach(function (stop, mi) {
      var prev = mi === 0 ? 0 : cell.stops[mi - 1];
      var travel = stop - prev;
      tl.to(cell.reel, {
        y: -stop * H,
        duration: 0.3 + Math.min(travel, 12) * 0.05,
        ease: 'power3.out'
      }, mi * STEP + delay);
    });
    /* chiusura del ciclo: torna a 0 nell'istante esatto in cui la timeline
       riparte (il primo carattere del rullo è lo stesso stato di partenza) */
    tl.set(cell.reel, { y: 0 }, PADDED.length * STEP - 0.001);
  });

  tl.to({}, { duration: PADDED.length * STEP }, 0);   /* durata del ciclo */

  window.TL = tl;
});
</script>
</body>
</html>
