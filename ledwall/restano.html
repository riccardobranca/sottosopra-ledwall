<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Sottosopra — Ledwall · Quante ne restano</title>
<link rel="stylesheet" href="_shared.css">
<style>
  /* «QUANTE NE RESTANO» — urgenza ONESTA: quante serate restano DOPO quella in
     corso. Nessun countdown finto, nessun «ultimi posti»: se ne restano 2, dice 2.
     La domenica il numero sparisce e la scena cambia registro (è l'ultima).
     Giornata da ?day=gio|ven|sab|dom, altrimenti dalla data reale (fallback ven). */

  #scene, #last {
    position: absolute; inset: 34px 34px 66px;
    flex-direction: column; visibility: hidden;
  }
  #scene { display: flex; }
  #last  { display: none; justify-content: center; }

  /* — riga alta — */
  .kickmask { overflow: hidden; flex: none; }
  .kickmask .label { display: block; font-size: 18px; line-height: 1.25; }

  /* — il numero gigante + la parola — */
  #numrow  { display: flex; align-items: flex-end; margin-top: 8px; flex: none; }
  #numwrap { flex: none; }                 /* mai shrink: la maschera taglierebbe il numero */
  .nmask   { display: block; overflow: hidden; }
  /* line-height 1.04 (non 1): mezza-interlinea di 0.02em sopra il glifo, così la
     maschera non ne rasa la sommità. Riquadro = 380 × 1.04 = 395px. */
  #num { display: block; font-size: 380px; line-height: 1.04; }

  /* la parola sta a destra e SIEDE sulla stessa linea di base del numero:
     sotto la base restano 0.10em del numero (38px) contro 0.08em della parola
     (7px) → 31px di compenso. (0.08em sotto la base: metrica SoSo26 già
     verificata in date.html sull'highlight dei numeri.) */
  #wordcol { flex: none; width: 520px; margin-left: auto; margin-bottom: 31px; }
  #word    { font-size: 90px; }

  /* — ledger basso: regolo, headliner che restano, biglietti — */
  #rule  { margin-top: auto; flex: none; transform: scaleX(0); transform-origin: 0% 50%; }
  #names { margin-top: 16px; flex: none; }
  .rowmask { overflow: hidden; }
  .nrow {
    display: flex; align-items: baseline; gap: 22px;
    font-size: 24px; line-height: 1.3; letter-spacing: 0.14em;
  }
  .nrow .d { color: var(--muted); width: 68px; flex: none; }
  .nrow .n { color: var(--fg); white-space: nowrap; }

  #buywrap { margin-top: 14px; flex: none; overflow: hidden; text-align: right; }
  /* margin-right negativo = compensa lo spazio di tracciatura dopo l'ultima
     lettera, così la riga finisce ESATTAMENTE sul margine destro */
  #buywrap .label { display: inline-block; font-size: 18px; line-height: 1.25; margin-right: -0.18em; }

  /* — variante domenica: niente numero, la scena diventa un titolone — */
  #lastTitle  { font-size: 150px; }
  #thanksmask { overflow: hidden; margin-top: 44px; }
  #thanksmask .label { display: block; font-size: 18px; line-height: 1.25; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">

    <div id="scene">
      <div class="kickmask"><span class="label" id="kick">Dopo stasera restano</span></div>

      <div id="numrow">
        <div id="numwrap"><span class="nmask"><span id="num">3</span></span></div>
        <div id="wordcol"><div class="just" id="word" data-text="Serate">Serate</div></div>
      </div>

      <div class="rule" id="rule"></div>
      <div id="names"></div>
      <div id="buywrap"><span class="label" id="buy">Biglietti su sottosopra.com</span></div>
    </div>

    <div id="last">
      <div id="lastblock">
        <div class="just" id="lastTitle" data-text="Questa è l ultima">Questa è l ultima</div>
        <!-- schwa: regola dura del brand (mai maschile sovraesteso). Il font ha Ə nativa. -->
        <div id="thanksmask"><span class="label" id="thanks">Grazie di essere statƏ qui</span></div>
      </div>
    </div>
  </div>
</div>

<script src="vendor/gsap.min.js"></script>
<script src="vendor/CustomEase.min.js"></script>
<script src="_shared.js"></script>
<script>
/* Headliner per serata (fonte: src/content/programma.yaml — programma definitivo 2026).
   Il giovedì è a ingresso libero: non compare mai tra le serate "che restano" da
   comprare, ma è la serata da cui ne restano 3. */
var HEAD = { ven: 'Generic Animal', sab: 'Vendredi sur Mer', dom: 'Ex-Otago' };

var DAYS = {
  gio: { left: 3, rest: [['Ven', HEAD.ven], ['Sab', HEAD.sab], ['Dom', HEAD.dom]] },
  ven: { left: 2, rest: [['Sab', HEAD.sab], ['Dom', HEAD.dom]] },
  sab: { left: 1, rest: [['Dom', HEAD.dom]] },
  dom: { left: 0, rest: [] }
};

/* giornata da ?day=gio|ven|sab|dom, altrimenti dalla data reale, fallback ven.
   Data LOCALE (non toISOString: in UTC dopo le 22:00 il festival "salterebbe" al
   giorno dopo, proprio nell'ora in cui il muro è acceso). */
function pickDay() {
  var q = new URLSearchParams(location.search).get('day');
  if (q && DAYS[q]) return q;
  var d = new Date();
  var iso = String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  return { '07-30': 'gio', '07-31': 'ven', '08-01': 'sab', '08-02': 'dom' }[iso] || 'ven';
}

var KEY = pickDay(), DAY = DAYS[KEY], SPECIAL = (DAY.left === 0);

/* ── costruzione del DOM: sincrona, non dipende dal caricamento del font ── */
(function build() {
  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  document.getElementById('scene').style.display = SPECIAL ? 'none' : 'flex';
  document.getElementById('last').style.display  = SPECIAL ? 'flex' : 'none';
  if (SPECIAL) return;

  document.getElementById('num').textContent = String(DAY.left);

  var w = (DAY.left === 1) ? 'Serata' : 'Serate';
  var wordEl = document.getElementById('word');
  wordEl.setAttribute('data-text', w);
  wordEl.textContent = w;

  document.getElementById('names').innerHTML = DAY.rest.map(function (r) {
    return '<div class="rowmask"><div class="nrow label">' +
             '<span class="d">' + esc(r[0]) + '</span>' +
             '<span class="n">' + esc(r[1]) + '</span>' +
           '</div></div>';
  }).join('');
})();

LW.ready(function () {
  var root = document.getElementById(SPECIAL ? 'last' : 'scene');

  /* misure affidabili solo a blocco visibile (poi la timeline lo riaccende a t=0) */
  root.style.visibility = 'visible';

  /* fit: costruisce le righe giustificate e cala il corpo finché stanno nel
     riquadro (mai ellissi, mai una parola che sfora il margine sul ledwall) */
  function overflows(lines) {
    return lines.some(function (l) { return l.scrollWidth > l.clientWidth + 1; });
  }
  function fitJust(el, start, min, maxLines) {
    var fs = start, guard = 0;
    el.style.fontSize = fs + 'px';
    var lines = LW.justify(el);
    while (guard++ < 20 && fs > min && (lines.length > maxLines || overflows(lines))) {
      fs = Math.max(min, Math.round(fs * 0.92));
      el.style.fontSize = fs + 'px';
      lines = LW.justify(el);
    }
    /* delta "compatto → giustificato": l'aria che si apre tra le lettere */
    lines.forEach(function (line) {
      var deltas = LW.packDeltas(line);
      [].slice.call(line.children).forEach(function (wd, i) { wd._dx = deltas[i] || 0; });
    });
    return lines;
  }

  var tl = gsap.timeline({ repeat: -1 });

  if (!SPECIAL) {
    /* ───────────── giovedì · venerdì · sabato: il numero ───────────── */
    var kick    = document.getElementById('kick');
    var numwrap = document.getElementById('numwrap');
    var num     = document.getElementById('num');
    var rule    = document.getElementById('rule');
    var buy     = document.getElementById('buy');

    var wordLines = fitJust(document.getElementById('word'), 90, 54, 1);
    var wordChars = [].slice.call(document.getElementById('word').querySelectorAll('.wd'));

    /* nomi: se una riga sforasse in larghezza, scende di corpo */
    var rows = [].slice.call(document.querySelectorAll('.nrow'));
    rows.forEach(function (row) {
      var fs = 24, g = 0;
      while (row.scrollWidth > row.clientWidth + 1 && fs > 16 && g++ < 10) {
        fs -= 2; row.style.fontSize = fs + 'px';
      }
    });

    root.style.visibility = 'hidden';

    /* stato iniziale — ri-applicato a ogni giro del loop */
    tl.set(root,      { visibility: 'visible' }, 0);
    tl.set(kick,      { yPercent: 110 }, 0);
    tl.set(num,       { yPercent: 110 }, 0);
    tl.set(numwrap,   { scale: 1, transformOrigin: '0% 100%' }, 0);
    tl.set(wordLines, { yPercent: 110 }, 0);
    tl.set(wordChars, { x: function (i, t) { return t._dx || 0; } }, 0);
    tl.set(rule,      { scaleX: 0, transformOrigin: '0% 50%' }, 0);
    tl.set(rows,      { yPercent: 110 }, 0);
    tl.set(buy,       { yPercent: 110 }, 0);

    /* eventi discreti sulla griglia ritmica di 0.6s (100 BPM) */
    /* 1 · entrata: l'occhiello, poi il numero sale da sotto la maschera */
    tl.to(kick,      { yPercent: 0, duration: 0.70, ease: 'soso' }, 0.00);
    tl.to(num,       { yPercent: 0, duration: 1.10, ease: 'soso' }, 0.60);
    /* 2 · la parola arriva compatta e poi si apre edge-to-edge */
    tl.to(wordLines, { yPercent: 0, duration: 0.90, ease: 'soso' }, 1.20);
    tl.to(wordChars, { x: 0, duration: 1.20, ease: 'expo.inOut', stagger: 0.02 }, 1.80);
    /* 3 · il ledger: regolo tirato da sinistra, poi i nomi a cascata */
    tl.to(rule,      { scaleX: 1, duration: 0.85, ease: 'soso' }, 2.40);
    tl.to(rows,      { yPercent: 0, duration: 0.75, ease: 'soso', stagger: 0.25 }, 3.00);
    tl.to(buy,       { yPercent: 0, duration: 0.70, ease: 'soso' }, 3.60);

    /* 4 · tenuta: il numero batte piano DUE volte (ancorato in basso a sinistra,
           così non invade la colonna della parola). Mai fermo del tutto.
           4.80 + 3.45×4 = 18.60 esatti: il battito finisce dove parte l'uscita. */
    tl.to(numwrap, { scale: 1.025, duration: 3.45, ease: 'sine.inOut', yoyo: true, repeat: 3 }, 4.80);

    /* 5 · uscita verso l'alto; il regolo si ritira nel verso in cui è arrivato */
    tl.to(rows,      { yPercent: -110, duration: 0.50, ease: 'power2.in', stagger: 0.06 }, 18.60);
    tl.set(rule,     { transformOrigin: '100% 50%' }, 18.59);
    tl.to(rule,      { scaleX: 0, duration: 0.45, ease: 'power2.in' }, 18.60);
    tl.to(buy,       { yPercent: -110, duration: 0.50, ease: 'power2.in' }, 18.65);
    tl.to(wordLines, { yPercent: -110, duration: 0.55, ease: 'power2.in' }, 18.75);
    tl.to(num,       { yPercent: -110, duration: 0.60, ease: 'power2.in' }, 18.85);
    tl.to(kick,      { yPercent: -110, duration: 0.50, ease: 'power2.in' }, 18.95);
    tl.set(root,     { visibility: 'hidden' }, 19.50);

  } else {
    /* ───────────── domenica: non resta nulla dopo, è l'ultima ───────────── */
    var block  = document.getElementById('lastblock');
    var thanks = document.getElementById('thanks');

    var titleLines = fitJust(document.getElementById('lastTitle'), 150, 88, 2);
    var titleChars = [].slice.call(document.getElementById('lastTitle').querySelectorAll('.wd'));

    root.style.visibility = 'hidden';

    tl.set(root,       { visibility: 'visible' }, 0);
    tl.set(block,      { scale: 1 }, 0);
    tl.set(titleLines, { yPercent: 110 }, 0);
    tl.set(titleChars, { x: function (i, t) { return t._dx || 0; } }, 0);
    tl.set(thanks,     { yPercent: 110 }, 0);

    tl.to(titleLines, { yPercent: 0, duration: 0.95, ease: 'soso', stagger: 0.12 }, 0.00);
    tl.to(titleChars, { x: 0, duration: 1.25, ease: 'expo.inOut', stagger: 0.012 }, 0.60);
    tl.to(thanks,     { yPercent: 0, duration: 0.75, ease: 'soso' }, 1.80);

    /* tenuta: il blocco respira (1.2%: dentro i margini, non tocca i bordi).
       3.60 + 3.75×4 = 18.60 esatti, dove parte l'uscita. */
    tl.to(block, { scale: 1.012, duration: 3.75, ease: 'sine.inOut', yoyo: true, repeat: 3 }, 3.60);

    tl.to(titleLines, { yPercent: -110, duration: 0.55, ease: 'power2.in', stagger: 0.07 }, 18.60);
    tl.to(thanks,     { yPercent: -110, duration: 0.50, ease: 'power2.in' }, 18.70);
    tl.set(root,      { visibility: 'hidden' }, 19.50);
  }

  /* respiro nero finale: il ciclo chiude a 20.0s esatti (ultimo frame ≡ primo:
     nero + meta, con tutto parcheggiato fuori dalle maschere) */
  tl.to({}, { duration: 0.50 }, 19.50);

  window.TL = tl; /* per scrub/verifica deterministica */
});

/* guardiano: se dopo 3s la timeline non esiste (font mai risolto, GSAP assente…)
   il muro non resta nero — si forza lo stato finale del blocco attivo. */
setTimeout(function () {
  if (window.TL) return;
  var root = document.getElementById(SPECIAL ? 'last' : 'scene');
  if (!root) return;
  root.style.visibility = 'visible';
  [].slice.call(root.querySelectorAll('.ln, #num, .nrow, .label, .rule')).forEach(function (n) {
    n.style.transform = 'none';
    n.style.opacity = 1;
  });
}, 3000);
</script>
</body>
</html>
